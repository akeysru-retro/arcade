<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9999 IN 1 - Ultimate Retro Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            background-color: #000; color: #fff; margin: 0; padding: 0;
            font-family: 'Press Start 2P', monospace;
            height: 100vh; overflow: hidden; user-select: none;
            -webkit-touch-callout: none; -webkit-user-select: none;
        }
        body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        
        .header-panel {
            display: flex; width: 100%; max-width: 400px; justify-content: space-between; align-items: center;
            padding: 8px 15px; box-sizing: border-box; background: #000; border-bottom: 2px solid #333; 
            position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 999999 !important;
        }
        .head-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px 10px; cursor: pointer;
        }
        .hidden { display: none !important; }

        #catalog-container {
            width: 100%; max-width: 400px; flex-grow: 1; overflow-y: auto; position: relative;
            background-color: #000; padding-top: 65px; padding-bottom: 70px; box-sizing: border-box;
            z-index: 10; display: flex; flex-direction: column; align-items: center;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; pointer-events: none;
        }
        
        .tab-content { width: 100%; z-index: 5; position: relative; display: none; }
        .tab-content.active { display: block; }

        .menu-title { font-size: 20px; color: #ffff00; text-shadow: 3px 3px #000; margin-bottom: 25px; text-align: center; letter-spacing: 2px; }
        .game-list { width: 100%; padding: 0 25px; box-sizing: border-box; }
        
        .retro-item { 
            font-size: 10px; color: #fff; text-shadow: 2px 2px #000; padding: 12px 0; 
            display: flex; align-items: center; text-transform: uppercase;
            border-bottom: 1px solid #111; justify-content: space-between;
        }
        .game-click-zone { display: flex; align-items: center; flex-grow: 1; cursor: pointer; justify-content: space-between; overflow: hidden; }
        .game-click-zone:active { color: #ffff00; }
        .game-title-text { display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .item-system-badge { font-size: 7px; padding: 3px 6px; background: #333; border-radius: 2px; color: #fff; margin-left: 10px; font-family: sans-serif; font-weight: bold; flex-shrink: 0; }
        .badge-nes { background: #b91c1c; }
        .badge-sega { background: #1e3a8a; }
        .badge-snes { background: #4c1d95; } 
        .badge-gba { background: #047857; }

        .fav-star-btn { font-size: 14px; cursor: pointer; padding: 0 5px 0 15px; user-select: none; filter: grayscale(100%); transition: transform 0.1s ease; }
        .fav-star-btn.active { filter: grayscale(0%); text-shadow: 0 0 4px #ffcc00; }

        .fav-filter-toggle {
            background: #111; border: 2px dashed #444; color: #888; font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 6px; width: calc(100% - 40px); margin: 0 20px 15px 20px; box-sizing: border-box;
            cursor: pointer; text-align: center; border-radius: 4px;
        }
        .fav-filter-toggle.active { border-color: #ffcc00; color: #ffcc00; background: #221c00; }

        .pagination-container {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 20px 25px 10px 25px; box-sizing: border-box;
            z-index: 15; position: relative; gap: 10px;
        }
        .page-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 8px 12px;
            cursor: pointer; border-radius: 4px;
        }
        .page-btn:active:not(:disabled) { background: #444; color: #ffff00; }
        .page-btn:disabled { background: #111; border-color: #333; color: #444; cursor: not-allowed; }
        .page-info-text { font-size: 7px; color: #888; text-align: center; }

        .btn-launch-new {
            width: 100%; background: #222; border: 3px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 12px;
            cursor: pointer; border-radius: 4px; text-align: center; box-sizing: border-box;
        }
        
        .secret-card { background: rgba(17, 17, 17, 0.9); border: 2px solid #444; margin: 0 20px 15px 20px; padding: 15px; border-radius: 4px; }
        .secret-game { font-size: 10px; color: #ffff00; margin-bottom: 6px; }
        .secret-title { font-size: 8px; color: #00ff00; margin-bottom: 10px; line-height: 1.4; }
        .secret-code { font-size: 8px; color: #fff; line-height: 1.6; background: #000; padding: 8px; border: 1px dashed #555; word-wrap: break-word; user-select: text; }

        .order-container { padding: 0 25px; box-sizing: border-box; width: 100%; }
        .order-text { font-size: 8px; line-height: 1.6; color: #aaa; margin-bottom: 20px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-label { font-size: 8px; color: #ffff00; }
        .form-input { 
            background: #111; border: 2px solid #555; padding: 10px; color: #fff; 
            font-family: 'Press Start 2P', monospace; font-size: 9px; border-radius: 4px;
        }
        .form-input:focus { border-color: #00ff00; outline: none; }
        
        select.form-input {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='%23ffff00'><polygon points='0,0 10,0 5,5'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 30px;
        }

        .tab-bar {
            position: fixed !important; bottom: 0 !important; left: 0; right: 0; height: 55px;
            background: #111; border-top: 3px solid #333; display: flex;
            justify-content: space-around; align-items: center; z-index: 205000 !important; box-sizing: border-box;
        }
        .tab-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; height: 100%; color: #888; cursor: pointer; background: none; border: none;
            font-family: 'Press Start 2P', monospace; font-size: 6px; gap: 6px;
        }
        .tab-item.active { color: #ffff00; background: #1a1a1a; }
        .tab-icon { font-size: 14px; }

        #emulator-layer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 50000; padding-top: 44px; box-sizing: border-box; }
        #emulator-container { width: 100%; height: 100%; background: #000; }
        
        #intro-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #000;
            z-index: 9999999 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #intro-video {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
        }

        #skip-intro-btn {
            position: absolute;
            bottom: 30px;
            background: rgba(17, 17, 17, 0.8);
            border: 2px solid #555;
            color: #888;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        #skip-intro-btn:active {
            color: #ffff00;
            border-color: #ffff00;
        }
    </style>
</head>
<body>
    <div id="intro-layer">
        <video id="intro-video" playsinline disablePictureInPicture controlslist="nodownload">
            <source src="https://akeysru-retro.github.io/arcade/app/intro.mp4" type="video/mp4">
        </video>
        <button id="skip-intro-btn" onclick="endIntro()">[ ПРОПУСТИТЬ СТАРТ ]</button>
    </div>

    <div class="header-panel">
        <button id="back-to-catalog" class="head-btn hidden" onclick="closeEmulator()">↩ МЕНЮ</button>
        <div id="main-title" style="font-size: 8px; letter-spacing: 1px;">9999 IN 1</div>
        <button id="emu-sound-btn" class="head-btn" onclick="toggleEmuSound()">🔊 ЗВУК</button>
    </div>
    
    <div id="catalog-container">
        <video autoplay muted loop playsinline disablePictureInPicture controlslist="nodownload" id="bg-video" class="bg-video">
            <source src="https://akeysru-retro.github.io/arcade/app/background-video.mp4" type="video/mp4">
        </video>

        <div id="tab-games" class="tab-content active">
            <div class="menu-title">9999 IN 1</div>
            <div style="padding: 0 20px 10px 20px; width: 100%; box-sizing: border-box;">
                <input type="text" id="search-game-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ...">
            </div>
            <button id="fav-filter-btn" class="fav-filter-toggle" onclick="toggleFavFilter()">[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]</button>
            <div class="game-list" id="games-list"></div>
            <div class="pagination-container" id="games-pagination"></div>
        </div>

        <div id="section-journals" class="tab-content">
            <div class="menu-title">ПРЕССА</div>
            <div class="game-list" id="journals-list"></div>
            <div class="pagination-container" id="journals-pagination"></div>
        </div>

        <div id="tab-secrets" class="tab-content">
            <div class="menu-title">СЕКРЕТЫ</div>
            <div style="padding: 0 20px 15px 20px;">
                <input type="text" id="search-secret-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ ИЛИ ЧИТА...">
            </div>
            <div id="secrets-list"></div>
            <div class="pagination-container" id="secrets-pagination"></div>
        </div>

        <div id="tab-order" class="tab-content">
            <div class="menu-title">ЗАКАЗ ИГР</div>
            <div class="order-container">
                <div class="order-text">ЗАКАЗ НОВОЙ ИГРЫ ПЛАТНЫЙ (100 РУБЛЕЙ). НАПИШИТЕ НАЗВАНИЕ, И МЫ ДОБАВИМ ЕЁ НА ПОЛКУ БОТА!</div>
                <div class="form-group">
                    <label class="form-label">НАЗВАНИЕ ИГРЫ:</label>
                    <input type="text" id="order-game-name" class="form-input" placeholder="НАПРИМЕР: CONTRA">
                </div>
                <div class="form-group">
                    <label class="form-label">ПЛАТФОРМА (КОНСОЛЬ):</label>
                    <select id="order-platform" class="form-input">
                        <option value="NES">NES (Dendy)</option>
                        <option value="SNES">Super Nintendo</option>
                        <option value="SEGA">Sega</option>
                        <option value="32X">Sega 32X</option>
                        <option value="TG16">PC Engine / TurboGrafx-16</option>
                        <option value="GB">Game Boy</option>
                        <option value="GBC">Game Boy Color</option>
                        <option value="GBA">Game Boy ADVANCE</option>
                    </select>
                </div>
                <button class="order-submit-btn btn-launch-new" style="background: #0064ff; border-color: #0040aa;" onclick="submitOrder()">ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>

        <div class="tab-bar" id="app-tab-bar">
            <button class="tab-item active" onclick="switchTab('games')">
                <span class="tab-icon">🎮</span><span>ИГРЫ</span>
            </button>
            <button class="tab-item" onclick="switchTab('journals')">
                <span class="tab-icon">📖</span><span>ПРЕССА</span>
            </button>
            <button class="tab-item" onclick="switchTab('secrets')">
                <span class="tab-icon">🔑</span><span>СЕКРЕТЫ</span>
            </button>
            <button class="tab-item" onclick="switchTab('order')">
                <span class="tab-icon">📥</span><span>ЗАКАЗ</span>
            </button>
        </div>
    </div>

    <div id="emulator-layer">
        <div id="emulator-container"></div>
    </div>

    <div id="journal-layer" style="display: none; position: fixed; top: 44px; left: 0; right: 0; bottom: 0; background: #111; z-index: 100000; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 10;">
            <button class="page-btn" id="pdf-prev-btn">◀ СТР</button>
            <span id="pdf-page-num" style="font-size: 8px; color: #ffff00; font-family: 'Press Start 2P', monospace;">0 / 0</span>
            <button class="page-btn" id="pdf-next-btn">СТР ▶</button>
        </div>
        <div style="display: flex; justify-content: center; align-items: flex-start; padding: 15px 0; background: #111; min-height: calc(100vh - 110px);">
            <canvas id="pdf-canvas" style="width: 100%; max-width: 380px; box-shadow: 0 0 10px #000; display: block;"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
