<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKEYS Arcade Player</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const system = urlParams.get('system') || 'nes';
        const gameUrl = urlParams.get('url');

        // Настройки для версии, где всё лежит в корне папки app
        window.EJS_player = '#game';
        window.EJS_biosUrl = '';
        window.EJS_gameUrl = gameUrl;
        window.EJS_core = system;
        
        // Точка (./) указывает лоадеру искать папки cores, src, localization прямо здесь
        window.EJS_pathtodata = './'; 
        
        // Включаем поддержку русского языка, раз папка добавлена!
        window.EJS_language = 'ru'; 
    </script>
    
    <script src="loader.js"></script>
</body>
</html>
