<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sega Dedicated Player</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        // Перехватываем параметры ссылки на игру из app.js
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('url');
        const gameName = urlParams.get('name') || 'Sega_Game';

        // Чистые настройки CDN из твоего успешного старого проекта!
        window.EJS_player = '#game';
        window.EJS_biosUrl = '';
        window.EJS_gameUrl = gameUrl ? decodeURIComponent(gameUrl) : '';
        window.EJS_core = 'sega'; // Тот самый заветный маркер
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/';
        window.EJS_language = 'ru';
        window.EJS_gameName = decodeURIComponent(gameName).replace(/ /g, '_');

        window.EJS_loadOnStart = true;
        window.EJS_startOnLoaded = true;
        window.EJS_DefaultSaveMode = 'browser';
        window.EJS_autosave = true;
        window.EJS_ForceLocalSave = true;
    </script>
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@latest/data/loader.js"></script>
</body>
</html>
