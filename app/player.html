<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKEYS Arcade Player</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const system = urlParams.get('system') || 'nes';
        const gameUrl = urlParams.get('url');

        window.EmuJS = {
            System: system,
            GameUrl: gameUrl,
            Language: "en",
            disableLocalization: true,
            ContainerId: "game",
            LoadFrame: true,
            // Поднимаемся на уровень выше папки app (../) и заходим в твою готовую папку emulator/
            ContentUrl: "../emulator/",
            OnStart: function() {
                console.log("Локальный движок из папки emulator запущен!");
            }
        };
    </script>
    <script src="../emulator/loader.js"></script>
</body>
</html>
