<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKEYS Retro Player</title>
    <style>
        html, body, #emulator {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <iframe id="emulator" src="" allowfullscreen allow="gamepad"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const system = urlParams.get('system') || 'nes';
        const gameUrl = urlParams.get('url');

        // Мапим консоли под требования NostalgiJS плеера
        const systemMap = {
            'nes': 'nes',
            'snes': 'snes',
            'segaMD': 'sega',
            'gb': 'gb',
            'gbc': 'gbc',
            'gba': 'gba'
        };

        const core = systemMap[system] || 'nes';

        // Формируем железную ссылку на проверенный независимый веб-плеер
        if (gameUrl) {
            document.getElementById('emulator').src = `https://web.nostalgi.js.org/?core=${core}&rom=${encodeURIComponent(gameUrl)}`;
        }
    </script>
</body>
</html>
