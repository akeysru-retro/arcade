<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKEYS Arcade Player</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        // ======= ДИНАМИЧЕСКИЙ ПЕРЕХВАТ ПАРАМЕТРОВ ИЗ URL =======
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('url');
        const gameCore = urlParams.get('core') || 'sega'; // По дефолту ставим sega, если забыли передать
        const gameName = urlParams.get('name') || 'Retro_Game';

        // Базовые настройки EmulatorJS 4.2.3
        window.EJS_player = '#game';
        window.EJS_biosUrl = '';
        window.EJS_gameUrl = gameUrl ? decodeURIComponent(gameUrl) : '';
        window.EJS_core = gameCore;
        window.EJS_pathtodata = './'; 
        window.EJS_language = 'ru'; 
        window.EJS_gameName = decodeURIComponent(gameName).replace(/ /g, '_');

        // ======= АВТОЗАПУСК И НАСТРОЙКИ КЭША / СОХРАНЕНИЙ =======
        window.EJS_loadOnStart = true; 
        window.EJS_DefaultSaveMode = 'browser'; // Сохраняем прогресс в браузере
        window.EJS_autosave = true;             // Автосохранение при выходе
        window.EJS_ForceLocalSave = true;       
        window.EJS_startOnLoaded = true;        // Запуск сразу после загрузки ядра
    </script>
    
    <script src="loader.js"></script>
</body>
</html>
