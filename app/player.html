<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AKEYS Arcade Player</title>
    <style>
        html, body, #game {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const system = urlParams.get('system') || 'nes';
        const gameUrl = urlParams.get('url');

        // Конфигурация EmulatorJS с жестко прописанным полным путем к CDN для всех файлов ядра
        window.EmuJS = {
            System: system,
            GameUrl: gameUrl,
            Language: "en",
            disableLocalization: true,
            ContainerId: "game",
            LoadFrame: true,
            // Вот это исправит 404: заставляем его брать все скрипты и стили строго из корня CDN
            ContentUrl: "https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/",
            OnStart: function() {
                console.log("Движок запущен!");
            }
        };
    </script>
    <script src="https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js"></script>
</body>
</html>
