<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9999 IN 1 - Ultimate Retro Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.1/jsnes.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="games.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            background-color: #000; color: #fff; margin: 0; padding: 0;
            font-family: 'Press Start 2P', monospace;
            height: 100vh; overflow: hidden; user-select: none;
        }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .header-panel {
            display: flex; width: 100%; max-width: 400px; justify-content: space-between; align-items: center;
            padding: 8px 15px; box-sizing: border-box; background: #000; border-bottom: 2px solid #333; 
            position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 200000 !important;
        }
        .head-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px 10px; cursor: pointer;
        }
        #sound-toggle.muted { color: #ffaa00; border-color: #663333; }
        #back-to-catalog { display: none; background: #224; border-color: #448; }
        
        .ingame-btn { display: none; font-size: 7px; padding: 6px 8px; }
        #header-save { background: #1e3d1e; border-color: #387338; color: #8fdf8f; }

        #catalog-container {
            width: 100%; max-width: 400px; flex-grow: 1; overflow-y: auto; position: relative;
            background-color: #000; padding-top: 65px; padding-bottom: 70px; box-sizing: border-box;
            z-index: 10; display: flex; flex-direction: column; align-items: center;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; pointer-events: none; opacity: 0.4;
        }
        
        .app-section { width: 100%; z-index: 5; position: relative; display: none; }
        #section-games { display: block; }

        .menu-title { font-size: 20px; color: #ffff00; text-shadow: 3px 3px #000; margin-bottom: 25px; text-align: center; letter-spacing: 2px; }
        .game-list { width: 100%; padding: 0 25px; box-sizing: border-box; }
        
        .retro-item { 
            font-size: 10px; color: #fff; text-shadow: 2px 2px #000; padding: 12px 0; 
            display: flex; align-items: center; text-transform: uppercase;
            border-bottom: 1px solid #111; justify-content: space-between;
        }
        .game-click-zone { display: flex; align-items: center; flex-grow: 1; cursor: pointer; justify-content: space-between; overflow: hidden; }
        .game-click-zone:active { color: #ffff00; }
        .game-title-text { display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-title-text::before { content: "▶ "; opacity: 0; margin-right: 8px; color: #ffff00; }
        .game-click-zone:active .game-title-text::before { opacity: 1; }
        
        .item-system-badge { font-size: 7px; padding: 3px 6px; background: #333; border-radius: 2px; color: #fff; margin-left: 10px; font-family: sans-serif; font-weight: bold; flex-shrink: 0; }
        .badge-nes { background: #b91c1c; }
        .badge-sega { background: #1e3a8a; }
        .badge-snes { background: #4c1d95; } 

        .fav-star-btn { font-size: 14px; cursor: pointer; padding: 0 5px 0 15px; user-select: none; filter: grayscale(100%); transition: transform 0.1s ease; }
        .fav-star-btn.active { filter: grayscale(0%); text-shadow: 0 0 4px #ffcc00; }

        .fav-filter-toggle {
            background: #111; border: 2px dashed #444; color: #888; font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 6px; width: calc(100% - 40px); margin: 0 20px 15px 20px; box-sizing: border-box;
            cursor: pointer; text-align: center; border-radius: 4px;
        }
        .fav-filter-toggle.active { border-color: #ffcc00; color: #ffcc00; background: #221c00; }

        .pagination-container {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 20px 25px 10px 25px; box-sizing: border-box;
            z-index: 15; position: relative; gap: 10px;
        }
        .page-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 8px 12px;
            cursor: pointer; border-radius: 4px;
        }
        .page-btn:active, .page-btn.active-press { background: #00aaee !important; border-color: #0055aa !important; color: #fff !important; transform: scale(0.95); }
        .page-btn:disabled { background: #111; border-color: #333; color: #444; cursor: not-allowed; transform: none !important; }
        .page-info-text { font-size: 7px; color: #888; text-align: center; }

        #section-saves-manager { padding: 0 25px; box-sizing: border-box; width: 100%; }
        .btn-launch-new {
            width: 100%; background: #00aaee; border: 3px solid #0055aa; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 14px;
            cursor: pointer; border-radius: 4px; margin-bottom: 20px; text-shadow: 1px 1px #000;
        }
        .saves-block-title { font-size: 8px; color: #888; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .cloud-save-card {
            background: rgba(20, 20, 20, 0.9); border: 2px solid #444; padding: 12px;
            border-radius: 4px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; margin-bottom: 10px;
        }
        .cloud-save-info { font-size: 8px; color: #ffff00; line-height: 1.4; }
        .cloud-save-date { font-size: 6px; color: #aaa; margin-top: 4px; line-height: 1.2; }

        .secret-card { background: rgba(17, 17, 17, 0.9); border: 2px solid #444; margin: 0 20px 15px 20px; padding: 15px; border-radius: 4px; }
        .secret-game { font-size: 10px; color: #ffff00; margin-bottom: 6px; }
        .secret-title { font-size: 8px; color: #00ff00; margin-bottom: 10px; line-height: 1.4; }
        .secret-code { font-size: 8px; color: #fff; line-height: 1.6; background: #000; padding: 8px; border: 1px dashed #555; word-wrap: break-word; user-select: text; }

        .order-container { padding: 0 25px; box-sizing: border-box; width: 100%; }
        .order-text { font-size: 8px; line-height: 1.6; color: #aaa; margin-bottom: 20px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-label { font-size: 8px; color: #ffff00; }
        .form-input { 
            background: #111; border: 2px solid #555; padding: 10px; color: #fff; 
            font-family: 'Press Start 2P', monospace; font-size: 9px; border-radius: 4px;
        }
        .form-input:focus { border-color: #00ff00; outline: none; }
        .order-submit-btn {
            width: 100%; background: #0064ff; border: 3px solid #0040aa; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 12px;
            cursor: pointer; border-radius: 4px; box-shadow: 0 4px 0 #002266; margin-top: 10px;
        }
        .order-submit-btn:active { transform: translateY(4px); box-shadow: none; }

        #game-screen { display: none; width: 100%; max-width: 400px; flex-grow: 1; background: #000; position: relative; z-index: 20; height: 100vh; padding-top: 44px; box-sizing: border-box; }
        #game-container { 
            width: 100%; flex-grow: 1; max-height: calc(100vh - 250px); background: #000; 
            position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; padding-top: 15px; box-sizing: border-box;
        }
        #nes-canvas { width: 100%; max-height: 100%; object-fit: contain; display: block; image-rendering: pixelated; }

        #sega-display-container { display: none; width: 100%; max-width: 400px; height: calc(100vh - 44px); position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 1000; background: #000; }
        #sega-display-container iframe { width: 100%; height: 100%; border: none; display: block; }

        #gamepad { position: absolute; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; width: 100%; padding: 15px; box-sizing: border-box; justify-content: space-between; border-top: 4px solid #222; background: #111; touch-action: none; }
        .main-controls { display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 130px; height: 130px; }
        
        .btn { background: #222; border: 3px solid #444; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; touch-action: none; transition: background 0.05s ease, transform 0.05s ease; }
        .btn:active, .btn.active-press { background: #00aaee !important; border-color: #0055aa !important; color: #fff !important; transform: scale(0.95); }
        
        #nes-buttons { display: inline-flex; gap: 15px; }
        .round-btn { width: 60px; height: 60px; background: #cc1111; border-radius: 50%; border: 4px solid #fff; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; font-family: sans-serif; box-shadow: 0 4px 0 #880000; touch-action: none; transition: background 0.05s ease, transform 0.05s ease, box-shadow 0.05s ease; }
        .round-btn:active, .round-btn.active-press { background: #ff3333 !important; transform: translateY(4px); box-shadow: none !important; }
        
        .system-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 15px; }
        .sys-row { display: flex; justify-content: center; gap: 20px; }
        .sys-btn { background: #333; border: 2px solid #555; color: #aaa; width: 80px; height: 22px; border-radius: 4px; font-size: 8px; display: flex; align-items: center; justify-content: center; touch-action: none; }

        .loading-overlay { display: none; position: absolute; top: 44px; left: 0; right: 0; bottom: 0; background: #000; z-index: 1500; flex-direction: column; align-items: center; justify-content: center; }
        .error-section { display: none; padding: 40px 25px; text-align: center; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header-panel">
        <button id="back-to-catalog" class="head-btn">↩ МЕНЮ</button>
        <button id="header-save" class="head-btn ingame-btn">💾 СОХРАНИТЬ ИГРУ</button>
        <div id="main-title" style="font-size: 8px; letter-spacing: 1px;">9999 IN 1</div>
        <button id="sound-toggle" class="head-btn muted">🔇 ЗВУК</button>
    </div>
    
    <div id="catalog-container">
        <!-- Анимированная ретро-заставка возвращена на место -->
        <video id="menu-bg-video" class="bg-video" loop playsinline webkit-playsinline muted>
            <source src="background-video.mp4" type="video/mp4">
        </video>

        <div id="section-games" class="app-section">
            <div class="menu-title">9999 IN 1</div>
            <div style="padding: 0 20px 10px 20px; width: 100%; box-sizing: border-box;">
                <input type="text" id="search-games-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ..." oninput="filterGames()">
            </div>
            <button id="fav-filter-btn" class="fav-filter-toggle" onclick="toggleFavFilter()">[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]</button>
            <div class="game-list" id="retro-game-list"></div>
            <div class="pagination-container" id="pagination-controls"></div>
        </div>

        <div id="section-saves" class="app-section">
            <div class="menu-title" id="saves-manager-title">ЗАГРУЗКА...</div>
            <div id="section-saves-manager">
                <button class="btn-launch-new" onclick="launchGamePureNew()">▶ ИГРАТЬ С НАЧАЛА</button>
                <div class="saves-block-title">ВЫБЕРИ СЛОТ ПАМЯТИ ТЕЛЕФОНА (1 ИЗ 5):</div>
                <div id="cloud-saves-list-container"></div>
            </div>
        </div>

        <div id="section-error" class="app-section error-section">
            <div class="menu-title" style="color:#ff2222;">СБОЙ ЗАГРУЗКИ</div>
            <div style="font-size: 8px; line-height: 1.8; color: #aaa; margin-bottom: 30px;" id="error-message-text"></div>
            <button class="btn-launch-new" style="background:#555; border-color:#333;" onclick="exitToCatalog()">↩ ВЕРНУТЬСЯ В КАТАЛОГ</button>
        </div>

        <div id="section-secrets" class="app-section">
            <div class="menu-title">СЕКРЕТЫ</div>
            <div style="padding: 0 20px 15px 20px;">
                <input type="text" id="search-secrets-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ ИЛИ ЧИТА..." oninput="filterSecrets()">
            </div>
            <div id="secrets-container"></div>
        </div>

        <div id="section-order" class="app-section">
            <div class="menu-title">ЗАКАЗ ИГР</div>
            <div class="order-container">
                <div class="order-text">ЗАКАЗ НОВОЙ ИГРЫ ПЛАТНЫЙ (100 РУБЛЕЙ). НАПИШИТЕ НАЗВАНИЕ, И МЫ ДОБАВИМ ЕЁ НА ПОЛКУ БОТА!</div>
                <div class="form-group">
                    <label class="form-label">НАЗВАНИЕ ИГРЫ:</label>
                    <input type="text" id="order-game-title" class="form-input" placeholder="НАПРИМЕР: TEENAGE MUTANT TURTLES">
                </div>
                <div class="form-group">
                    <label class="form-label">ПЛАТФОРМА (КОНСОЛЬ):</label>
                    <input type="text" id="order-game-system" class="form-input" placeholder="DENDY / SEGA / GBA">
                </div>
                <button id="order-btn-submit" class="order-submit-btn" onclick="sendOrderRequest()">ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div style="font-size:10px; color:#ffff00; margin-bottom:15px; letter-spacing:1px; text-align:center;">ЗАГРУЗКА ЭМУЛЯТОРА...</div>
        <div style="font-size:7px; color:#555;" id="loading-subtext">ЧТЕНИЕ СЕКТОРОВ КАРТРИДЖА</div>
    </div>

    <div class="tab-bar" id="app-tab-bar">
        <button class="tab-item active" onclick="switchTab('games', this)">
            <span class="tab-icon">🎮</span><span>ИГРЫ</span>
        </button>
        <button class="tab-item" onclick="switchTab('secrets', this)">
            <span class="tab-icon">🔑</span><span>СЕКРЕТЫ</span>
        </button>
        <button class="tab-item" onclick="switchTab('order', this)">
            <span class="tab-icon">📥</span><span>ЗАКАЗ</span>
        </button>
    </div>

    <div id="game-screen">
        <div id="game-container">
            <canvas id="nes-canvas" width="256" height="240"></canvas>
        </div>
        <div id="sega-display-container"></div>
        <div id="gamepad">
            <div class="main-controls">
                <div class="dpad">
                    <div></div><div class="btn" id="up">▲</div><div></div>
                    <div class="btn" id="left">◀</div><div></div><div class="btn" id="right">▶</div>
                    <div></div><div class="btn" id="down">▼</div><div></div>
                </div>
                <div id="nes-buttons">
                    <div class="round-btn" id="btn-b">B</div>
                    <div class="round-btn" id="btn-a">A</div>
                </div>
            </div>
            <div class="system-buttons">
                <div class="sys-row">
                    <div class="sys-btn" id="btn-select">SELECT</div><div class="sys-btn" id="btn-start">START</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var db = new Dexie('emu-saves-v1');
        db.version(1).stores({
            states: 'key, platform, gameId, slot, timestamp, data',
            favorites: 'file'
        });

        var baseGames = [];        
        var filteredGames = [];    
        var currentPage = 1;     
        var itemsPerPage = 5; 
        var showOnlyFavorites = false; 

        var currentSelectedGameObj = null; 
        var selectedSlotNumber = "1"; 
        var activeGameHash = ""; 

        var allSecrets = [];
        var videoEl = document.getElementById('menu-bg-video');

        // 🔥 ИСПРАВЛЕНО: Ждем открытия Базы Данных Dexie перед загрузкой и выводом списка игр
        db.open().then(function() {
            var rawGamesList = window.MY_GAMES || [];
            if (rawGamesList.length > 0) {
                baseGames = rawGamesList.sort(function(a, b) {
                    var titleA = a.title.toString().toLowerCase().trim();
                    var titleB = b.title.toString().toLowerCase().trim();
                    return titleA.localeCompare(titleB, 'ru', { sensitivity: 'base' });
                });
                filteredGames = [].concat(baseGames); 
                renderGamesPage(currentPage);
            }
            if(videoEl) { videoEl.play().catch(function(e){}); }
        }).catch(function(err) {
            console.error("Dexie failed to open", err);
        });

        function generateRomHash(arrayBuffer) {
            var view = new DataView(arrayBuffer);
            var hash = '';
            for (var i = 0; i < 8 && i < arrayBuffer.byteLength; i++) {
                var b = view.getUint8(i).toString(16).padStart(2, '0');
                hash += b;
            }
            return hash;
        }

        async function isGameFavorite(file) {
            var fav = await db.favorites.get(file);
            return !!fav;
        }

        async function toggleFavorite(file, event) {
            event.stopPropagation(); 
            var isFav = await isGameFavorite(file);
            if (isFav) {
                await db.favorites.delete(file);
            } else {
                await db.favorites.put({file: file});
            }
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            if (showOnlyFavorites) { filterGames(); } else { renderGamesPage(currentPage); }
        }

        function filterGames() {
            var query = document.getElementById('search-games-input').value.toLowerCase().trim();
            
            db.favorites.toArray().then(function(favs) {
                var favFiles = favs.map(f => f.file);
                filteredGames = baseGames.filter(function(game) {
                    var matchesSearch = game.title.toLowerCase().includes(query);
                    var matchesFav = !showOnlyFavorites || isGameFavorite(game.file);
                    return matchesSearch && matchesFav;
                });
                currentPage = 1; 
                renderGamesPage(currentPage);
            });
        }

        function toggleFavFilter() {
            showOnlyFavorites = !showOnlyFavorites;
            var btn = document.getElementById('fav-filter-btn');
            if (showOnlyFavorites) {
                btn.classList.add('active'); btn.textContent = "[ РЕЖИМ: ТОЛЬКО ИЗБРАННОЕ ]";
            } else {
                btn.classList.remove('active'); btn.textContent = "[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]";
            }
            filterGames();
        }

        function renderGamesPage(page) {
            var listContainer = document.getElementById('retro-game-list');
            if (!listContainer) return;
            listContainer.innerHTML = "";
            if (filteredGames.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; font-size:8px; color:#555; padding:30px 0;">СПИСОК ПУСТ</div>';
                renderPaginationButtons(); return;
            }
            var startIndex = (page - 1) * itemsPerPage;
            var endIndex = startIndex + itemsPerPage;
            var pageItems = filteredGames.slice(startIndex, endIndex);

            db.favorites.toArray().then(function(favs) {
                var favFiles = favs.map(f => f.file);
                
                pageItems.forEach(function(game, index) {
                    var globalIndex = startIndex + index + 1;
                    var num = globalIndex.toString().padStart(4, '0'); 
                    var item = document.createElement('div');
                    item.className = 'retro-item';
                    var badgeClass = 'badge-nes'; var sysLabel = 'NES';
                    if (game.system === 'sega') { badgeClass = 'badge-sega'; sysLabel = 'SEGA'; }
                    else if (game.system === 'snes') { badgeClass = 'badge-snes'; sysLabel = 'SNES'; }
                    
                    var isFav = favFiles.indexOf(game.file) !== -1;
                    var favClass = isFav ? 'active' : '';

                    item.innerHTML = `
                        <div class="game-click-zone" onclick="openSavesManagerScreen(${JSON.stringify(game).replace(/"/g, '&quot;')})">
                            <div class="game-title-text">${num}. ${game.title}</div>
                            <span class="item-system-badge ${badgeClass}">${sysLabel}</span>
                        </div>
                        <div class="fav-star-btn ${favClass}" onclick="toggleFavorite('${game.file}', event)">⭐</div>
                    `;
                    listContainer.appendChild(item);
                });
                renderPaginationButtons();
            });
        }

        function renderPaginationButtons() {
            var controlsContainer = document.getElementById('pagination-controls');
            if (!controlsContainer) return;
            controlsContainer.innerHTML = "";
            var totalPages = Math.ceil(filteredGames.length / itemsPerPage);
            if (totalPages <= 1) return;

            var prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn'; prevBtn.disabled = (currentPage === 1); prevBtn.textContent = "◀ НАЗАД";
            prevBtn.addEventListener('click', function() { changeGamesPage(currentPage - 1); });

            var infoSpan = document.createElement('span');
            infoSpan.className = 'page-info-text'; infoSpan.innerHTML = `PAGE<br>${currentPage}/${totalPages}`;

            var nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn'; nextBtn.disabled = (currentPage === totalPages); nextBtn.textContent = "ВПЕРЕД ▶";
            nextBtn.addEventListener('click', function() { changeGamesPage(currentPage + 1); });

            controlsContainer.appendChild(prevBtn); controlsContainer.appendChild(infoSpan); controlsContainer.appendChild(nextBtn);
        }

        function changeGamesPage(newPage) {
            currentPage = newPage; renderGamesPage(currentPage);
            var catalog = document.getElementById('catalog-container'); if (catalog) catalog.scrollTop = 0;
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        async function openSavesManagerScreen(gameObj) {
            currentSelectedGameObj = gameObj;

            var sections = document.getElementsByClassName('app-section');
            for(var i=0; i<sections.length; i++) { sections[i].style.display = 'none'; }
            document.getElementById('section-saves').style.display = 'block';
            document.getElementById('saves-manager-title').textContent = gameObj.title.toUpperCase();

            var listContainer = document.getElementById('cloud-saves-list-container');
            listContainer.innerHTML = '<div style="text-align:center; font-size:7px; color:#555; padding:20px 0;">ИНСПЕКЦИЯ СЛОТОВ...</div>';

            try {
                var res = await fetch(gameObj.file);
                if (!res.ok) throw new Error();
                var buf = await res.arrayBuffer();
                activeGameHash = generateRomHash(buf); 

                listContainer.innerHTML = "";
                for (var slot = 1; slot <= 5; slot++) {
                    var uniqueKey = `${gameObj.system}:${activeGameHash}:${slot}`;
                    var record = await db.states.get(uniqueKey);
                    
                    var card = document.createElement('div');
                    card.className = 'cloud-save-card';
                    
                    if (record) {
                        var dateStr = new Date(record.timestamp).toLocaleString('ru-RU');
                        card.innerHTML = `
                            <div>
                                <div class="cloud-save-info" style="color:#00ff00;">СЛОТ ПАМЯТИ 0${slot}</div>
                                <div class="cloud-save-date">Запись: ${dateStr}</div>
                            </div>
                            <button class="head-btn" style="font-size:7px; background:#0064ff;" onclick="launchGameWithCloudSlot('${slot}', true)">ЗАГРУЗИТЬ</button>
                        `;
                    } else {
                        card.innerHTML = `
                            <div>
                                <div class="cloud-save-info" style="color:#666;">СЛОТ ПАМЯТИ 0${slot}</div>
                                <div class="cloud-save-date">ПУСТАЯ ЯЧЕЙКА ПАМЯТИ</div>
                            </div>
                            <button class="head-btn" style="font-size:7px; background:#222; color:#777;" onclick="launchGameWithCloudSlot('${slot}', false)">ИГРАТЬ</button>
                        `;
                    }
                    listContainer.appendChild(card);
                }
            } catch(e) {
                console.error('Fetch check error:', e);
                triggerLocalErrorScreen("Не удалось загрузить файл манифеста игры. Возможно, проблема CORS или отсутствия доступа к CDN хранилищу.");
            }
        }

        function triggerLocalErrorScreen(errorText) {
            var sections = document.getElementsByClassName('app-section');
            for(var i=0; i<sections.length; i++) { sections[i].style.display = 'none'; }
            document.getElementById('error-message-text').textContent = errorText;
            document.getElementById('section-error').style.display = 'block';
        }

        function launchGamePureNew() {
            selectedSlotNumber = "1"; 
            startGame(currentSelectedGameObj.file, currentSelectedGameObj.title, currentSelectedGameObj.system, false);
        }

        function launchGameWithCloudSlot(slotNum, hasSave) {
            selectedSlotNumber = String(slotNum).trim(); 
            startGame(currentSelectedGameObj.file, currentSelectedGameObj.title, currentSelectedGameObj.system, hasSave);
        }

        (function loadRetroSecrets() {
            var script = document.createElement('script');
            script.src = gasRetroUrl + "?action=get_secrets&callback=renderSecrets";
            document.head.appendChild(script);
        })();

        function renderSecrets(data) { allSecrets = data || []; displaySecretsList(allSecrets); }

        function displaySecretsList(secretsArray) {
            var secretsContainer = document.getElementById('secrets-container'); if (!secretsContainer) return;
            secretsContainer.innerHTML = "";
            if (secretsArray.length === 0) {
                secretsContainer.innerHTML = '<div style="text-align:center; font-size:8px; color:#555; padding-top:20px;">НИЧЕГО НЕ НАЙДЕНО</div>'; return;
            }
            secretsArray.forEach(function(item) {
                var card = document.createElement('div'); card.className = 'secret-card';
                card.innerHTML = `
                    <div class="secret-game">[${item.type}] ${item.game}</div>
                    <div class="secret-title">${item.title}</div>
                    <div class="secret-code">${item.code}</div>
                `;
                secretsContainer.appendChild(card);
            });
        }

        function filterSecrets() {
            var query = document.getElementById('search-secrets-input').value.toLowerCase().trim();
            if (!query) { displaySecretsList(allSecrets); return; }
            var filtered = allSecrets.filter(function(item) {
                return item.game.toLowerCase().includes(query) || item.title.toLowerCase().includes(query) || item.type.toLowerCase().includes(query);
            });
            displaySecretsList(filtered);
        }

        function sendOrderRequest() {
            var titleInput = document.getElementById('order-game-title').value.trim();
            var systemInput = document.getElementById('order-game-system').value.trim();
            if (!titleInput) { window.Telegram.WebApp.showAlert("ВВЕДИТЕ НАЗВАНИЕ ИГРЫ!"); return; }
            var initData = window.Telegram.WebApp.initDataUnsafe;
            var userId = initData.user ? initData.user.id : "";
            var username = initData.user ? initData.user.username : "no_name";
            if (!userId) { window.Telegram.WebApp.showAlert("ОШИБКА TELEGRAM ID!"); return; }
            var btnSubmit = document.getElementById('order-btn-submit');
            btnSubmit.disabled = true; btnSubmit.textContent = "ОТПРАВКА...";

            var requestUrl = gasRetroUrl + "?action=submit_order&title=" + encodeURIComponent(titleInput) + 
                             "&system=" + encodeURIComponent(systemInput || "Dendy") + "&user_id=" + userId + "&username=" + encodeURIComponent(username);

            fetch(requestUrl, { mode: 'no-cors' })
                .then(function() {
                    window.Telegram.WebApp.showPopup({
                        title: "ЗАЯВКА СФОРМИРОВАНА!",
                        message: "Счет отправлен в диалог с ботом.",
                        buttons: [
                            { id: "bot", type: "default", text: "🤖 К БОТУ" },
                            { id: "close", type: "cancel", text: "ЗАКРЫТЬ" }
                        ]
                    }, function(buttonId) {
                        if (buttonId === "bot") { window.Telegram.WebApp.openTelegramLink("https://t.me/gameMAN888_bot"); }
                        window.Telegram.WebApp.close(); 
                    });
                })
                .catch(function() { window.Telegram.WebApp.showAlert("ОШИБКА СВЯЗИ С СЕРВЕРОМ!"); btnSubmit.disabled = false; btnSubmit.textContent = "ОТПРАВИТЬ ЗАЯВКУ"; });
        }

        function switchTab(tabId, buttonElement) {
            showOnlyFavorites = false;
            document.getElementById('fav-filter-btn').classList.remove('active');
            document.getElementById('fav-filter-btn').textContent = "[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]";
            document.getElementById('search-games-input').value = "";
            filterGames();

            var sections = document.getElementsByClassName('app-section');
            for(var i=0; i<sections.length; i++) { sections[i].style.display = 'none'; }
            var tabs = document.getElementsByClassName('tab-item');
            for(var i=0; i<tabs.length; i++) { tabs[i].classList.remove('active'); }
            document.getElementById('section-' + tabId).style.display = 'block';
            buttonElement.classList.add('active');
        }

        var canvas = document.getElementById('nes-canvas');
        var ctx = canvas.getContext('2d');
        var audioCtx = null; var audioEnabled = false; var bufferSize = 4096;
        var audioBuffer = new Float32Array(bufferSize); var audioBufferIndex = 0;
        var gameLoopInterval = null; var currentRomName = ""; var currentSystem = "nes";

        var nes = new jsnes.NES({
            onFrame: function(buffer) {
                var imageData = ctx.getImageData(0, 0, 256, 240); var data = imageData.data;
                for (var i = 0; i < buffer.length; i++) {
                    var pixel = buffer[i]; var index = i * 4;
                    data[index] = pixel & 0xff; data[index+1] = (pixel >> 8) & 0xff; data[index+2] = (pixel >> 16) & 0xff; data[index+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            },
            onAudioSample: function(left, right) {
                if (!audioEnabled) return;
                if (audioBufferIndex < bufferSize) { audioBuffer[audioBufferIndex++] = left; }
            }
        });

        function initAudio() {
            if (audioCtx) return;
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext({ sampleRate: 44100 });
            var scriptProcessor = audioCtx.createScriptProcessor(bufferSize, 0, 1);
            scriptProcessor.onaudioprocess = function(e) {
                var output = e.outputBuffer.getChannelData(0);
                for (var i = 0; i < bufferSize; i++) { output[i] = audioEnabled ? audioBuffer[i] : 0; }
                audioBuffer.fill(0); audioBufferIndex = 0;
            };
            scriptProcessor.connect(audioCtx.destination);
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
        }

        var soundBtn = document.getElementById('sound-toggle');
        if (soundBtn) {
            soundBtn.addEventListener('click', function() {
                initAudio(); if (audioCtx) audioCtx.resume();
                audioEnabled = !audioEnabled; this.textContent = audioEnabled ? "🔊 ЗВУК: ВКЛ" : "🔇 ЗВУК";
                if (currentSystem === "sega" || currentSystem === "snes") {
                    var iframe = document.getElementById('active-emulator-iframe');
                    if (iframe && iframe.contentWindow) { iframe.contentWindow.postMessage({ volume: audioEnabled ? 1 : 0 }, '*'); }
                }
            });
        }

        function launchIsolatedEmulatorJS(systemType, gameTitle, romBuffer, saveBuffer) {
            var container = document.getElementById('sega-display-container');
            container.innerHTML = ""; 

            var coreType = (systemType === "sega") ? "segaMD" : "snes";
            var initialVolume = audioEnabled ? 1 : 0;

            var iframeHtml = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <style>
                    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
                    #game { width: 100%; height: 100%; }
                </style>
            </head>
            <body>
                <div id="game"></div>
                <script>
                    EJS_player = "#game";
                    EJS_core = "${coreType}";
                    EJS_color = "#0064ff";
                    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
                    EJS_startOnLoaded = false; 
                    EJS_Volume = ${initialVolume};
                    EJS_mouse = true; 
                    EJS_Header = true; 
                <\/script>
                <script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
                <script>
                    window.addEventListener('message', function(msg) {
                        if (msg.data.action === 'boot_wasm_core' && msg.data.rom instanceof ArrayBuffer) {
                            window.EJS_gameName = msg.data.title;
                            window.EJS_gameUrl = URL.createObjectURL(new Blob([msg.data.rom]));
                            
                            if (typeof window.EJS_EmulatorRun !== 'undefined') {
                                window.EJS_EmulatorRun();
                            }

                            var checkExist = setInterval(function() {
                               if (typeof window.EJS_emulator !== 'undefined' && window.EJS_emulator.loadState) {
                                  clearInterval(checkExist);
                                  
                                  window.parent.postMessage({ action: 'ejs_core_ready' }, '*');

                                  if (msg.data.save instanceof ArrayBuffer) {
                                      setTimeout(function(){
                                         try {
                                            window.EJS_emulator.loadState(new Uint8Array(msg.data.save));
                                         } catch(err) { console.error(err); }
                                      }, 800);
                                  }
                               }
                            }, 100);
                        }

                        if (msg.data.action === 'request_16bit_save') {
                            if (typeof window.EJS_emulator !== 'undefined' && window.EJS_emulator.saveState) {
                                window.EJS_emulator.saveState(function(res) {
                                    var bytes = res.state || res; 
                                    if (!bytes) return;
                                    var cleanBuffer = bytes.buffer || bytes;
                                    window.parent.postMessage({ action: 'respond_16bit_save', buffer: cleanBuffer }, '*', [cleanBuffer]);
                                });
                            }
                        }
                    });
                <\/script>
            </body>
            </html>
            `;

            var iframe = document.createElement('iframe');
            iframe.id = "active-emulator-iframe";
            iframe.srcdoc = iframeHtml;
            
            iframe.addEventListener('load', function() {
                var romToSend = romBuffer.slice(0);
                var saveToSend = saveBuffer ? saveBuffer.slice(0) : null;

                // 🔥 ИСПРАВЛЕНО: Убран дублирующийся ключ action
                var payload = { 
                    action: 'boot_wasm_core', 
                    rom: romToSend, 
                    title: gameTitle,
                    save: saveToSend
                };
                
                var transferList = [romToSend];
                if(saveToSend) transferList.push(saveToSend);

                iframe.contentWindow.postMessage(payload, '*', transferList);
            });

            container.appendChild(iframe);
        }

        async function startGame(romUrl, gameTitle, system, hasSave) {
            currentRomName = romUrl;
            currentSystem = system || "nes";
            if(videoEl) videoEl.pause();

            var overlay = document.getElementById('loading-overlay');
            var subtext = document.getElementById('loading-subtext');
            overlay.style.display = 'flex';
            subtext.textContent = "ПОДГОТОВКА СЛОТОВ ПАМЯТИ...";

            try {
                subtext.textContent = "ЗАГРУЗКА ОБРАЗА ИГРЫ С CDN...";
                var res = await fetch(romUrl);
                if (!res.ok) throw new Error(`HTTP Error Status: ${res.status} ${res.statusText}`);
                var romBuffer = await res.arrayBuffer();

                activeGameHash = generateRomHash(romBuffer);
                var uniqueKey = `${currentSystem}:${activeGameHash}:${selectedSlotNumber}`;
                
                var record = null;
                if (hasSave) {
                    subtext.textContent = "ИЗВЛЕЧЕНИЕ СНИМКА ИЗ INDEXEDDB...";
                    record = await db.states.get(uniqueKey);
                }

                document.getElementById('catalog-container').style.display = 'none';
                document.getElementById('app-tab-bar').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('back-to-catalog').style.display = 'block';
                document.getElementById('header-save').style.display = 'block';
                document.getElementById('main-title').textContent = gameTitle + " [СЛОТ 0" + selectedSlotNumber + "]";

                initAudio(); 
                if (audioCtx) audioCtx.resume();

                if (currentSystem === "sega" || currentSystem === "snes") {
                    document.getElementById('game-container').style.display = 'none';
                    document.getElementById('gamepad').style.display = 'none'; 
                    document.getElementById('sega-display-container').style.display = 'block';
                    
                    subtext.textContent = "КОМПИЛЯЦИЯ WASM ЯДРА КОНСОЛИ...";
                    launchIsolatedEmulatorJS(currentSystem, gameTitle, romBuffer, record ? record.data : null);
                } else {
                    document.getElementById('game-container').style.display = 'flex';
                    document.getElementById('gamepad').style.display = 'flex'; 
                    document.getElementById('sega-display-container').style.display = 'none';
                    
                    nes.loadROM(new Uint8Array(romBuffer));
                    if(gameLoopInterval) clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(function() { nes.frame(); }, 1000 / 60);
                    
                    if (record && record.data) {
                        var stringData = new TextDecoder().decode(record.data);
                        nes.fromJSON(JSON.parse(stringData));
                    }
                    overlay.style.display = 'none';
                }
            } catch(e) {
                overlay.style.display = 'none';
                console.error("Critical core fetch error:", e);
                triggerLocalErrorScreen("Не удалось считать файл картриджа. Возникла ошибка сети, CORS-блокировка внешнего CDN или ссылка на ROM устарела.");
            }
        }

        function exitToCatalog() {
            if(gameLoopInterval) clearInterval(gameLoopInterval);
            document.getElementById('loading-overlay').style.display = 'none';

            if(currentSystem === "sega" || currentSystem === "snes") {
                var container = document.getElementById('sega-display-container');
                var iframe = document.getElementById('active-emulator-iframe');
                if(iframe) { iframe.src = "about:blank"; iframe.remove(); }
                container.innerHTML = ""; container.style.display = "none";
            }

            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('back-to-catalog').style.display = 'none';
            document.getElementById('header-save').style.display = 'none';
            
            var sections = document.getElementsByClassName('app-section');
            for(var i=0; i<sections.length; i++) { sections[i].style.display = 'none'; }
            document.getElementById('section-games').style.display = 'block';

            document.getElementById('catalog-container').style.display = 'flex';
            document.getElementById('app-tab-bar').style.display = 'flex';
            document.getElementById('main-title').textContent = '9999 IN 1';
            
            if(videoEl) { videoEl.play().catch(function(e){}); }
            filterGames();
        }
        
        document.getElementById('back-to-catalog').addEventListener('click', exitToCatalog);

        document.getElementById('header-save').addEventListener('click', async function() {
            if (!currentRomName || !activeGameHash) return;
            
            var saveBtn = document.getElementById('header-save');
            saveBtn.disabled = true;
            saveBtn.textContent = "ЗАПИСЬ...";

            if (currentSystem === "nes") {
                var uniqueKey = `nes:${activeGameHash}:${selectedSlotNumber}`;
                var rawSavePayload = JSON.stringify(nes.toJSON());
                var encodedData = new TextEncoder().encode(rawSavePayload);
                
                try {
                    await db.states.put({
                        key: uniqueKey,
                        platform: 'nes',
                        romUrl: currentRomName,
                        gameId: activeGameHash,
                        slot: selectedSlotNumber,
                        timestamp: Date.now(),
                        data: encodedData.buffer
                    });
                    window.Telegram.WebApp.showAlert("ПРОГРЕСС DENDY УСПЕШНО ЗАПИСАН В ПАМЯТЬ ТЕЛЕФОНА!");
                } catch(err) {
                    window.Telegram.WebApp.showAlert("Не удалось записать прогресс — возможно, закончилось свободное место.");
                }
                saveBtn.disabled = false;
                saveBtn.textContent = "💾 СОХРАНИТЬ ИГРУ";
            } else if (currentSystem === "sega" || currentSystem === "snes") {
                var iframe = document.getElementById('active-emulator-iframe');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ action: 'request_16bit_save' }, '*');
                }
            }
        });

        window.addEventListener('message', async function(e) {
            if (!e.data) return;
            
            if (e.data.action === 'ejs_core_ready') {
                document.getElementById('loading-overlay').style.display = 'none';
            }

            if (e.data.action === 'respond_16bit_save' && e.data.buffer) {
                var uniqueKey = `${currentSystem}:${activeGameHash}:${selectedSlotNumber}`;
                
                try {
                    await db.states.put({
                        key: uniqueKey,
                        platform: currentSystem,
                        romUrl: currentRomName,
                        gameId: activeGameHash,
                        slot: selectedSlotNumber,
                        timestamp: Date.now(),
                        data: e.data.buffer
                    });
                    window.Telegram.WebApp.showAlert("ПРОГРЕСС ИГРЫ УСПЕШНО ЗАПИСАН В ПАМЯТЬ ТЕЛЕФОНА!");
                } catch(err) {
                    window.Telegram.WebApp.showAlert("Не удалось записать слепок 16-бит — проверьте свободную память устройства.");
                }
                
                var saveBtn = document.getElementById('header-save');
                saveBtn.disabled = false;
                saveBtn.textContent = "💾 СОХРАНИТЬ ИГРУ";
            }
        });

        function bindKey(elementId, nesKey) {
            var el = document.getElementById(elementId);
            if(!el) return;

            var startHandler = function(e) {
                if (e.cancelable) e.preventDefault();
                el.classList.add('active-press'); 
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback && e.type === 'touchstart') {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
                if(currentSystem === "nes") nes.buttonDown(1, nesKey);
            };

            var endHandler = function(e) {
                if (e.cancelable) e.preventDefault();
                el.classList.remove('active-press');
                if(currentSystem === "nes") nes.buttonUp(1, nesKey);
            };

            el.addEventListener('touchstart', startHandler, { passive: false });
            el.addEventListener('touchend', endHandler, { passive: false });
            el.addEventListener('mousedown', startHandler);
            el.addEventListener('mouseup', endHandler);
            el.addEventListener('mouseleave', endHandler);
        }
        
        bindKey('up', jsnes.Controller.BUTTON_UP); 
        bindKey('down', jsnes.Controller.BUTTON_DOWN);
        bindKey('left', jsnes.Controller.BUTTON_LEFT); 
        bindKey('right', jsnes.Controller.BUTTON_RIGHT);
        bindKey('btn-a', jsnes.Controller.BUTTON_A); 
        bindKey('btn-b', jsnes.Controller.BUTTON_B);
        bindKey('btn-start', jsnes.Controller.BUTTON_START); 
        bindKey('btn-select', jsnes.Controller.BUTTON_SELECT);

        var keyMap = {
            38: jsnes.Controller.BUTTON_UP,    
            40: jsnes.Controller.BUTTON_DOWN,  
            37: jsnes.Controller.BUTTON_LEFT,  
            39: jsnes.Controller.BUTTON_RIGHT, 
            90: jsnes.Controller.BUTTON_A,     
            88: jsnes.Controller.BUTTON_B,     
            13: jsnes.Controller.BUTTON_START, 
            32: jsnes.Controller.BUTTON_SELECT 
        };

        window.addEventListener('keydown', function(e) {
            if(currentSystem === "nes" && keyMap[e.keyCode] !== undefined) {
                nes.buttonDown(1, keyMap[e.keyCode]);
            }
        });
        window.addEventListener('keyup', function(e) {
            if(currentSystem === "nes" && keyMap[e.keyCode] !== undefined) {
                nes.buttonUp(1, keyMap[e.keyCode]);
            }
        });
    </script>
</body>
</html>
