<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9999 IN 1 - Ultimate Retro Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.1/jsnes.min.js"></script>
    <script src="games.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { background-color: #000; color: #fff; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; height: 100vh; overflow: hidden; user-select: none; }
        body { display: flex; flex-direction: column; align-items: center; }
        .header-panel { display: flex; width: 100%; max-width: 400px; justify-content: space-between; align-items: center; padding: 8px 15px; box-sizing: border-box; background: #000; border-bottom: 2px solid #333; position: relative; z-index: 10000; }
        .head-btn { background: #222; border: 2px solid #555; color: #fff; font-size: 8px; padding: 6px 10px; cursor: pointer; }
        #back-to-catalog { display: none; background: #224; border-color: #448; }
        #catalog-container { width: 100%; max-width: 400px; flex-grow: 1; overflow-y: auto; background: #000; padding: 25px 0 70px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .app-section { width: 100%; display: none; }
        #section-games { display: block; }
        .menu-title { font-size: 20px; color: #ffff00; margin-bottom: 25px; text-align: center; }
        .game-list { width: 100%; padding: 0 25px; box-sizing: border-box; }
        .retro-item { font-size: 10px; padding: 12px 0; display: flex; align-items: center; border-bottom: 1px solid #111; justify-content: space-between; }
        .game-click-zone { flex-grow: 1; cursor: pointer; }
        .item-system-badge { font-size: 7px; padding: 3px 6px; background: #333; border-radius: 2px; margin-left: 10px; }
        #game-screen { display: none; width: 100%; max-width: 400px; height: 100vh; flex-direction: column; background: #000; position: absolute; top: 0; z-index: 20; }
        #game-container { width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #nes-canvas { width: 100%; object-fit: contain; image-rendering: pixelated; }
        #sega-display-container { display: none; width: 100%; height: 100%; }
        #sega-display-container iframe { width: 100%; height: 100%; border: none; }
        #gamepad { display: flex; flex-direction: column; padding: 15px; background: #111; border-top: 4px solid #222; }
        .btn { background: #222; border: 3px solid #444; color: white; border-radius: 8px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .round-btn { width: 60px; height: 60px; background: #cc1111; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
        .sys-btn { background: #333; color: #aaa; padding: 10px 20px; border-radius: 4px; font-size: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header-panel">
        <button id="back-to-catalog" class="head-btn">↩ МЕНЮ</button>
        <div id="main-title" style="font-size: 8px;">9999 IN 1</div>
        <button id="sound-toggle" class="head-btn">🔊 ЗВУК</button>
    </div>
    <div id="catalog-container">
        <div id="section-games" class="app-section">
            <div class="menu-title">9999 IN 1</div>
            <div class="game-list" id="retro-game-list"></div>
        </div>
    </div>
    <div id="game-screen">
        <div id="game-container"><canvas id="nes-canvas" width="256" height="240"></canvas></div>
        <div id="sega-display-container"></div>
        <div id="gamepad">
            <div class="sys-row" style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
                <div class="sys-btn" id="btn-select">SELECT</div><div class="sys-btn" id="btn-start">START</div>
            </div>
            <div class="sys-row" style="display:flex; justify-content:center; gap:10px;">
                <div class="sys-btn" id="nes-save-btn" style="background:#1e3d1e;">💾 SAVE</div>
                <div class="sys-btn" id="nes-load-btn" style="background:#1e2e3d;">📂 LOAD</div>
            </div>
        </div>
    </div>
    <script>
        var nes = new jsnes.NES({
            onFrame: function(buffer) {
                var img = ctx.getImageData(0, 0, 256, 240);
                for (var i = 0; i < buffer.length; i++) {
                    var p = buffer[i];
                    img.data[i*4] = p & 0xff; img.data[i*4+1] = (p>>8) & 0xff; img.data[i*4+2] = (p>>16) & 0xff; img.data[i*4+3] = 255;
                }
                ctx.putImageData(img, 0, 0);
            }
        });
        var ctx = document.getElementById('nes-canvas').getContext('2d');
        
        function startGame(romUrl, gameTitle, system) {
            currentRomName = romUrl; currentSystem = system;
            document.getElementById('catalog-container').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('back-to-catalog').style.display = 'block';

            if (system === "nes") {
                document.getElementById('nes-save-btn').style.display = 'block';
                document.getElementById('nes-load-btn').style.display = 'block';
                var req = new XMLHttpRequest(); req.open("GET", romUrl, true); req.overrideMimeType("text/plain; charset=x-user-defined");
                req.onload = function() { nes.loadROM(this.responseText); gameLoopInterval = setInterval(nes.frame, 1000/60); };
                req.send();
            } else {
                document.getElementById('nes-save-btn').style.display = 'none';
                document.getElementById('nes-load-btn').style.display = 'none';
                launchIsolatedEmulatorJS(romUrl, system, gameTitle);
            }
        }

        function launchIsolatedEmulatorJS(romUrl, system, gameTitle) {
            var container = document.getElementById('sega-display-container');
            container.style.display = 'block';
            var iframe = document.createElement('iframe');
            iframe.id = "active-emulator-iframe";
            iframe.srcdoc = `...тут твой HTML для 16-бит...`; // Вставь сюда HTML из прошлого ответа
            container.appendChild(iframe);
        }

        document.getElementById('nes-save-btn').onclick = function() {
            if(nes) localStorage.setItem("nes_save_" + currentRomName, JSON.stringify(nes.toJSON()));
            alert("NES Сохранено!");
        };
        document.getElementById('nes-load-btn').onclick = function() {
            var data = localStorage.getItem("nes_save_" + currentRomName);
            if(data) nes.fromJSON(JSON.parse(data));
        };
    </script>
</body>
</html>
