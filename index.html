<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9999 IN 1 - Ultimate Retro Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.1/jsnes.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="games.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            background-color: #000; color: #fff; margin: 0; padding: 0;
            font-family: 'Press Start 2P', monospace;
            height: 100vh; overflow: hidden; user-select: none;
            -webkit-touch-callout: none; -webkit-user-select: none;
        }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .header-panel {
            display: flex; width: 100%; max-width: 400px; justify-content: space-between; align-items: center;
            padding: 8px 15px; box-sizing: border-box; background: #000; border-bottom: 2px solid #333; 
            position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 200000 !important;
        }
        .head-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px 10px; cursor: pointer;
        }
        #sound-toggle.muted { color: #ffaa00; border-color: #663333; }
        #back-to-catalog { display: none; background: #224; border-color: #448; }
        
        .ingame-btn { display: none; font-size: 7px; padding: 6px 8px; }
        #header-save { background: #1e3d1e; border-color: #387338; color: #8fdf8f; }

        #catalog-container {
            width: 100%; max-width: 400px; flex-grow: 1; overflow-y: auto; position: relative;
            background-color: #000; padding-top: 65px; padding-bottom: 70px; box-sizing: border-box;
            z-index: 10; display: flex; flex-direction: column; align-items: center;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; pointer-events: none;
        }
        
        .app-section { width: 100%; z-index: 5; position: relative; display: none; }
        #section-games { display: block; }

        .menu-title { font-size: 20px; color: #ffff00; text-shadow: 3px 3px #000; margin-bottom: 25px; text-align: center; letter-spacing: 2px; }
        .game-list { width: 100%; padding: 0 25px; box-sizing: border-box; }
        
        .retro-item { 
            font-size: 10px; color: #fff; text-shadow: 2px 2px #000; padding: 12px 0; 
            display: flex; align-items: center; text-transform: uppercase;
            border-bottom: 1px solid #111; justify-content: space-between;
        }
        .game-click-zone { display: flex; align-items: center; flex-grow: 1; cursor: pointer; justify-content: space-between; overflow: hidden; }
        .game-click-zone:active { color: #ffff00; }
        .game-title-text { display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-title-text::before { content: "▶ "; opacity: 0; margin-right: 8px; color: #ffff00; }
        .game-click-zone:active .game-title-text::before { opacity: 1; }
        
        .item-system-badge { font-size: 7px; padding: 3px 6px; background: #333; border-radius: 2px; color: #fff; margin-left: 10px; font-family: sans-serif; font-weight: bold; flex-shrink: 0; }
        .badge-nes { background: #b91c1c; }
        .badge-sega { background: #1e3a8a; }
        .badge-snes { background: #4c1d95; } 

        .fav-star-btn { font-size: 14px; cursor: pointer; padding: 0 5px 0 15px; user-select: none; filter: grayscale(100%); transition: transform 0.1s ease; }
        .fav-star-btn.active { filter: grayscale(0%); text-shadow: 0 0 4px #ffcc00; }

        .fav-filter-toggle {
            background: #111; border: 2px dashed #444; color: #888; font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 6px; width: calc(100% - 40px); margin: 0 20px 15px 20px; box-sizing: border-box;
            cursor: pointer; text-align: center; border-radius: 4px;
        }
        .fav-filter-toggle.active { border-color: #ffcc00; color: #ffcc00; background: #221c00; }

        .pagination-container {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 20px 25px 10px 25px; box-sizing: border-box;
            z-index: 15; position: relative; gap: 10px;
        }
        .page-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 8px 12px;
            cursor: pointer; border-radius: 4px;
        }
        .page-btn:active:not(:disabled) { background: #444; color: #ffff00; }
        .page-btn:disabled { background: #111; border-color: #333; color: #444; cursor: not-allowed; }
        .page-info-text { font-size: 7px; color: #888; text-align: center; }

        #section-saves-manager { padding: 0 25px; box-sizing: border-box; width: 100%; }
        .btn-launch-new {
            width: 100%; background: #00aaee; border: 3px solid #0055aa; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 14px;
            cursor: pointer; border-radius: 4px; margin-bottom: 20px; text-shadow: 1px 1px #000;
        }
        .saves-block-title { font-size: 8px; color: #888; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .cloud-save-card {
            background: rgba(20, 20, 20, 0.9); border: 2px solid #444; padding: 12px;
            border-radius: 4px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; margin-bottom: 10px;
        }
        .cloud-save-info { font-size: 8px; color: #ffff00; line-height: 1.4; }
        .cloud-save-date { font-size: 6px; color: #aaa; margin-top: 4px; line-height: 1.2; }

        .secret-card { background: rgba(17, 17, 17, 0.9); border: 2px solid #444; margin: 0 20px 15px 20px; padding: 15px; border-radius: 4px; }
        .secret-game { font-size: 10px; color: #ffff00; margin-bottom: 6px; }
        .secret-title { font-size: 8px; color: #00ff00; margin-bottom: 10px; line-height: 1.4; }
        .secret-code { font-size: 8px; color: #fff; line-height: 1.6; background: #000; padding: 8px; border: 1px dashed #555; word-wrap: break-word; user-select: text; }

        .order-container { padding: 0 25px; box-sizing: border-box; width: 100%; }
        .order-text { font-size: 8px; line-height: 1.6; color: #aaa; margin-bottom: 20px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-label { font-size: 8px; color: #ffff00; }
        .form-input { 
            background: #111; border: 2px solid #555; padding: 10px; color: #fff; 
            font-family: 'Press Start 2P', monospace; font-size: 9px; border-radius: 4px;
        }
        .form-input:focus { border-color: #00ff00; outline: none; }
        .order-submit-btn {
            width: 100%; background: #0064ff; border: 3px solid #0040aa; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 12px;
            cursor: pointer; border-radius: 4px; box-shadow: 0 4px 0 #002266; margin-top: 10px;
        }
        .order-submit-btn:active { transform: translateY(4px); box-shadow: none; }

        #game-screen { display: none; width: 100%; max-width: 400px; flex-grow: 1; background: #000; position: relative; z-index: 20; height: 100vh; padding-top: 44px; box-sizing: border-box; }
        #game-container { 
            width: 100%; flex-grow: 1; max-height: calc(100vh - 250px); background: #000; 
            position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; padding-top: 15px; box-sizing: border-box;
        }
        #nes-canvas { width: 100%; max-height: 100%; object-fit: contain; display: block; image-rendering: pixelated; }

        #sega-display-container { display: none; width: 100%; max-width: 400px; height: calc(100vh - 44px); position: absolute; top: 44px; left: 0; right: 0; bottom: 0; z-index: 1000; background: #000; }
        #sega-display-container iframe { width: 100%; height: 100%; border: none; display: block; }

        #gamepad { position: absolute; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; width: 100%; padding: 15px; box-sizing: border-box; justify-content: space-between; border-top: 4px solid #222; background: #111; touch-action: none; }
        .main-controls { display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 130px; height: 130px; }
        .btn { background: #222; border: 3px solid #444; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; touch-action: none; }
        .btn:active { background: #444; }
        #nes-buttons { display: inline-flex; gap: 15px; }
        .round-btn { width: 60px; height: 60px; background: #cc1111; border-radius: 50%; border: 4px solid #fff; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; font-family: sans-serif; box-shadow: 0 4px 0 #880000; touch-action: none; }
        .round-btn:active { background: #aa0000; transform: translateY(4px); box-shadow: none; }
        .system-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 15px; }
        .sys-row { display: flex; justify-content: center; gap: 20px; }
        .sys-btn { background: #333; border: 2px solid #555; color: #aaa; width: 80px; height: 22px; border-radius: 4px; font-size: 8px; display: flex; align-items: center; justify-content: center; touch-action: none; }

        .tab-bar {
            position: fixed !important; bottom: 0 !important; left: 0; right: 0; height: 55px;
            background: #111; border-top: 3px solid #333; display: flex;
            justify-content: space-around; align-items: center; z-index: 205000 !important; box-sizing: border-box;
        }
        .tab-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; height: 100%; color: #888; cursor: pointer; background: none; border: none;
            font-family: 'Press Start 2P', monospace; font-size: 7px; gap: 6px;
        }
        .tab-item.active { color: #ffff00; background: #1a1a1a; }
        .tab-icon { font-size: 14px; }

        .loading-overlay { display: none; position: absolute; top: 44px; left: 0; right: 0; bottom: 0; background: #000; z-index: 1500; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header-panel">
        <button id="back-to-catalog" class="head-btn">↩ МЕНЮ</button>
        <button id="header-save" class="head-btn ingame-btn">💾 СЕЙВ В ОБЛАКО</button>
        <div id="main-title" style="font-size: 8px; letter-spacing: 1px;">9999 IN 1</div>
        <button id="sound-toggle" class="head-btn muted">🔇 ЗВУК</button>
    </div>
    
    <div id="catalog-container">
        <video id="menu-bg-video" class="bg-video" loop playsinline webkit-playsinline>
            <source src="background-video.mp4" type="video/mp4">
        </video>

        <div id="section-games" class="app-section">
            <div class="menu-title">9999 IN 1</div>
            <div style="padding: 0 20px 10px 20px; width: 100%; box-sizing: border-box;">
                <input type="text" id="search-games-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ..." oninput="filterGames()">
            </div>
            <button id="fav-filter-btn" class="fav-filter-toggle" onclick="toggleFavFilter()">[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]</button>
            <div class="game-list" id="retro-game-list"></div>
            <div class="pagination-container" id="pagination-controls"></div>
        </div>

        <div id="section-saves" class="app-section">
            <div class="menu-title" id="saves-manager-title">ЗАГРУЗКА...</div>
            <div id="section-saves-manager">
                <button class="btn-launch-new" onclick="launchGamePureNew()">▶ ИГРАТЬ С НАЧАЛА</button>
                <div class="saves-block-title">ВЫБЕРИ СЛОТ ОБЛАКА (1 ИЗ 5):</div>
                <div id="cloud-saves-list-container"></div>
            </div>
        </div>

        <div id="section-secrets" class="app-section">
            <div class="menu-title">СЕКРЕТЫ</div>
            <div style="padding: 0 20px 15px 20px;">
                <input type="text" id="search-secrets-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ ИЛИ ЧИТА..." oninput="filterSecrets()">
            </div>
            <div id="secrets-container"></div>
        </div>

        <div id="section-order" class="app-section">
            <div class="menu-title">ЗАКАЗ ИГР</div>
            <div class="order-container">
                <div class="order-text">ЗАКАЗ НОВОЙ ИГРЫ ПЛАТНЫЙ (100 РУБЛЕЙ). НАПИШИТЕ НАЗВАНИЕ, И МЫ ДОБАВИМ ЕЁ НА ПОЛКУ БОТА!</div>
                <div class="form-group">
                    <label class="form-label">НАЗВАНИЕ ИГРЫ:</label>
                    <input type="text" id="order-game-title" class="form-input" placeholder="НАПРИМЕР: TEENAGE MUTANT TURTLES">
                </div>
                <div class="form-group">
                    <label class="form-label">ПЛАТФОРМА (КОНСОЛЬ):</label>
                    <input type="text" id="order-game-system" class="form-input" placeholder="DENDY / SEGA / GBA">
                </div>
                <button id="order-btn-submit" class="order-submit-btn" onclick="sendOrderRequest()">ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>

        <div class="tab-bar" id="app-tab-bar">
            <button class="tab-item active" onclick="switchTab('games', this)">
                <span class="tab-icon">🎮</span><span>ИГРЫ</span>
            </button>
            <button class="tab-item" onclick="switchTab('secrets', this)">
                <span class="tab-icon">🔑</span><span>СЕКРЕТЫ</span>
            </button>
            <button class="tab-item" onclick="switchTab('order', this)">
                <span class="tab-icon">📥</span><span>ЗАКАЗ</span>
            </button>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div style="font-size:10px; color:#ffff00; margin-bottom:15px; letter-spacing:1px; text-align:center;">ЗАГРУЗКА ЭМУЛЯТОРА...</div>
    </div>

    <div id="game-screen">
        <div id="game-container">
            <canvas id="nes-canvas" width="256" height="240"></canvas>
        </div>
        <div id="sega-display-container"></div>
        <div id="gamepad">
            <div class="main-controls">
                <div class="dpad">
                    <div></div><div class="btn" id="up">▲</div><div></div>
                    <div class="btn" id="left">◀</div><div></div><div class="btn" id="right">▶</div>
                    <div></div><div class="btn" id="down">▼</div><div></div>
                </div>
                <div id="nes-buttons">
                    <div class="round-btn" id="btn-b">B</div>
                    <div class="round-btn" id="btn-a">A</div>
                </div>
            </div>
            <div class="system-buttons">
                <div class="sys-row">
                    <div class="sys-btn" id="btn-select">SELECT</div><div class="sys-btn" id="btn-start">START</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        var gasRetroUrl = "https://script.google.com/macros/s/AKfycbwBjulaVnjKN-Af3oDFFFaG4Us8n6Jgcz3BTJRL1HThFxlgMuxv_D4x1yK4Khy-BsVL/exec";

        var baseGames = [];        
        var filteredGames = [];    
        var currentPage = 1;     
        var itemsPerPage = 5; 
        var showOnlyFavorites = false; 

        var currentSelectedGameObj = null; 
        var selectedSlotNumber = "1"; 
        var cloudSavesMap = {}; 

        var allSecrets = [];
        var videoEl = document.getElementById('menu-bg-video');

        var rawGamesList = window.MY_GAMES || [];
        if (rawGamesList.length > 0) {
            baseGames = rawGamesList.sort(function(a, b) {
                var titleA = a.title.toString().toLowerCase().trim();
                var titleB = b.title.toString().toLowerCase().trim();
                return titleA.localeCompare(titleB, 'ru', { sensitivity: 'base' });
            });
            filteredGames = [].concat(baseGames); 
            renderGamesPage(currentPage);
        }
        if(videoEl) { videoEl.muted = true; videoEl.play().catch(function(e){}); }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (currentSystem === "nes" && gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                    console.log('NES: paused on visibilitychange');
                }
                var iframe = document.getElementById('active-emulator-iframe');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ action: 'pause_emulator' }, '*');
                }
            } else {
                if (currentSystem === "nes" && !gameLoopInterval) {
                    gameLoopInterval = setInterval(function() { nes.frame(); }, 1000 / 60);
                    console.log('NES: resumed on visibilitychange');
                }
                var iframe = document.getElementById('active-emulator-iframe');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ action: 'resume_emulator' }, '*');
                }
            }
        });

        function isGameFavorite(file) {
            var favs = JSON.parse(localStorage.getItem('retro_favs') || "[]");
            return favs.indexOf(file) !== -1;
        }

        function toggleFavorite(file, event) {
            event.stopPropagation(); 
            var favs = JSON.parse(localStorage.getItem('retro_favs') || "[]");
            var idx = favs.indexOf(file);
            if (idx === -1) { favs.push(file); } else { favs.splice(idx, 1); }
            localStorage.setItem('retro_favs', JSON.stringify(favs));
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            if (showOnlyFavorites) { filterGames(); } else { renderGamesPage(currentPage); }
        }

        function filterGames() {
            var query = document.getElementById('search-games-input').value.toLowerCase().trim();
            filteredGames = baseGames.filter(function(game) {
                var matchesSearch = game.title.toLowerCase().includes(query);
                var matchesFav = !showOnlyFavorites || isGameFavorite(game.file);
                return matchesSearch && matchesFav;
            });
            currentPage = 1; 
            renderGamesPage(currentPage);
        }

        function toggleFavFilter() {
            showOnlyFavorites = !showOnlyFavorites;
            var btn = document.getElementById('fav-filter-btn');
            if (showOnlyFavorites) {
                btn.classList.add('active'); btn.textContent = "[ РЕЖИМ: ТОЛЬКО ИЗБРАННОЕ ]";
            } else {
                btn.classList.remove('active'); btn.textContent = "[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]";
            }
            filterGames();
        }

        function renderGamesPage(page) {
            var listContainer = document.getElementById('retro-game-list');
            if (!listContainer) return;
            listContainer.innerHTML = "";
            if (filteredGames.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; font-size:8px; color:#555; padding:30px 0;">СПИСОК ПУСТ</div>';
                renderPaginationButtons(); return;
            }
            var startIndex = (page - 1) * itemsPerPage;
            var endIndex = startIndex + itemsPerPage;
            var pageItems = filteredGames.slice(startIndex, endIndex);

            pageItems.forEach(function(game, index) {
                var globalIndex = startIndex + index + 1;
                var num = globalIndex.toString().padStart(4, '0'); 
                var item = document.createElement('div');
                item.className = 'retro-item';
                var badgeClass = 'badge-nes'; var sysLabel = 'NES';
                if (game.system === 'sega') { badgeClass = 'badge-sega'; sysLabel = 'SEGA'; }
                else if (game.system === 'snes') { badgeClass = 'badge-snes'; sysLabel = 'SNES'; }
                var isFav = isGameFavorite(game.file);
                var favClass = isFav ? 'active' : '';

                item.innerHTML = `
                    <div class="game-click-zone" onclick="openSavesManagerScreen(${JSON.stringify(game).replace(/"/g, '&quot;')})">
                        <div class="game-title-text">${num}. ${game.title}</div>
                        <span class="item-system-badge ${badgeClass}">${sysLabel}</span>
                    </div>
                    <div class="fav-star-btn ${favClass}" onclick="toggleFavorite('${game.file}', event)">⭐</div>
                `;
                listContainer.appendChild(item);
            });
            renderPaginationButtons();
        }

        function renderPaginationButtons() {
            var controlsContainer = document.getElementById('pagination-controls');
            if (!controlsContainer) return;
            controlsContainer.innerHTML = "";
            var totalPages = Math.ceil(filteredGames.length / itemsPerPage);
            if (totalPages <= 1) return;

            var prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn'; prevBtn.disabled = (currentPage === 1); prevBtn.textContent = "◀ НАЗАД";
            prevBtn.addEventListener('click', function() { changeGamesPage(currentPage - 1); });

            var infoSpan = document.createElement('span');
            infoSpan.className = 'page-info-text'; infoSpan.innerHTML = `PAGE<br>${currentPage}/${totalPages}`;

            var nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn'; nextBtn.disabled = (currentPage === totalPages); nextBtn.textContent = "ВПЕРЕД ▶";
            nextBtn.addEventListener('click', function() { changeGamesPage(currentPage + 1); });

            controlsContainer.appendChild(prevBtn); controlsContainer.appendChild(infoSpan); controlsContainer.appendChild(nextBtn);
        }

        function changeGamesPage(newPage) {
            currentPage = newPage; renderGamesPage(currentPage);
            var catalog = document.getElementById('catalog-container'); if (catalog) catalog.scrollTop = 0;
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        function openSavesManagerScreen(gameObj) {
            currentSelectedGameObj = gameObj;
            cloudSavesMap = {}; 

            var sections = document.getElementsByClassName('app-section');
            for(var i=0; i<sections.length; i++) { sections[i].style.display = 'none'; }
            document.getElementById('section-saves').style.display = 'block';
            document.getElementById('saves-manager-title').textContent = gameObj.title.toUpperCase();

            var listContainer = document.getElementById('cloud-saves-list-container');
            listContainer.innerHTML = '<div style="text-align:center; font-size:7px; color:#888; padding:20px 0;">ОПРОС ОБЛАЧНЫХ СЛОТОВ...</div>';

            var initData = window.Telegram.WebApp.initDataUnsafe;
            var userId = initData.user ? initData.user.id : "test_user_888";

            var script = document.createElement('script');
            script.src = gasRetroUrl + "?action=get_saves&user_id=" + userId + "&game_file=" + encodeURIComponent(gameObj.file) + "&callback=onCloudSavesReceived";
            document.head.appendChild(script);
        }

        function onCloudSavesReceived(data) {
            var listContainer = document.getElementById('cloud-saves-list-container');
            listContainer.innerHTML = "";

        var canvas = document.getElementById('nes-canvas');

        var gameLoopInterval = null; var currentRomName = ""; var currentSystem = "nes";

        var nes = new jsnes.NES({
            onFrame: function(buffer) {
                var imageData = ctx.getImageData(0, 0, 256, 240); var data = imageData.data;
                for (var i = 0; i < buffer.length; i++) {
                    var pixel = buffer[i]; var index = i * 4;
                    data[index] = pixel & 0xff; data[index+1] = (pixel >> 8) & 0xff; data[index+2] = (pixel >> 16) & 0xff; data[index+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            },
            onAudioSample: function(left, right) {
                if (!audioEnabled) return;
                if (audioBufferIndex < bufferSize) { audioBuffer[audioBufferIndex++] = left; }
            }
        });

        function initAudio() {
            if (audioCtx) return;
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext({ sampleRate: 44100 });
            var scriptProcessor = audioCtx.createScriptProcessor(bufferSize, 0, 1);
            scriptProcessor.onaudioprocess = function(e) {
                var output = e.outputBuffer.getChannelData(0);
                for (var i = 0; i < bufferSize; i++) { output[i] = audioEnabled ? audioBuffer[i] : 0; }
                audioBuffer.fill(0); audioBufferIndex = 0;
            };
            scriptProcessor.connect(audioCtx.destination);
        }

        var soundBtn = document.getElementById('sound-toggle');
        if (soundBtn) {

                audioEnabled = !audioEnabled; this.textContent = audioEnabled ? "🔊 ЗВУК: ВКЛ" : "🔇 ЗВУК";
                if(videoEl) videoEl.muted = !audioEnabled;
                if(audioEnabled) this.classList.remove('muted'); else this.classList.add('muted');

                              window.parent.postMessage({ action: 'hide_loader' }, '*');
                           }
                        }, 150);
                    });
                `;
            } else {
                injectionPayloadScript = `
                    window.addEventListener('load', function() {
                        setTimeout(function(){ window.parent.postMessage({ action: 'hide_loader' }, '*'); }, 2000);
                    });
                `;
            }

            var iframeHtml = `
            <!DOCTYPE html>
            <html>

                    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }

                <\/script>
                <script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
                <script>
                    \${injectionPayloadScript}

                    window.addEventListener('message', function(e) {
                        if (!e.data || typeof e.data !== 'object') return;

                        if (e.data.action === 'pause_emulator') {
                            if (typeof window.EJS_instance !== 'undefined' && typeof window.EJS_instance.pause === 'function') {
                                window.EJS_instance.pause();
                            }
                        }
                        if (e.data.action === 'resume_emulator') {
                            if (typeof window.EJS_instance !== 'undefined' && typeof window.EJS_instance.resume === 'function') {
                                window.EJS_instance.resume();

                        if (e.data.action === 'request_16bit_save') {

                                window.EJS_instance.exportState(function(bytes) {

                            }
                        }

        // 🔥 ИСПРАВЛЕНО: Возвращена 100% совместимая структура JSON для GAS + убран ломающий no-cors
        function sendPackToGoogleSheetsCloud(userId, file, dateTime, payload, slot) {
            var compressedData = compressData(payload);

            var rawJsonPayload = {
                action: "set_save",
                user_id: String(userId),
                game_file: String(file),
                date_time: String(dateTime),
                slot_num: String(slot), 
                save_data: String(compressedData)
            };

            var attempt = 0;
            var maxAttempts = 3;

            function makeRequest() {
                // Шлем как чистый структурированный JSON-пакет с no-cors, чтобы пробить редиректы Google Таблиц
                fetch(gasRetroUrl, { 
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(rawJsonPayload)
                })
                .then(function() {
                    window.Telegram.WebApp.showAlert("ПРОГРЕСС СЛОТА 0" + slot + " УСПЕШНО ЗАПИСАН В ОБЛАКО!");
                    cloudSavesMap[slot] = payload;
                    var saveBtn = document.getElementById('header-save');
                    saveBtn.disabled = false; saveBtn.textContent = "💾 СЕЙВ В ОБЛАКО";
                })
                .catch(function(error) {
                    if (attempt < maxAttempts) {
                        attempt++;
                        setTimeout(makeRequest, 1500);
                    } else {
                        window.Telegram.WebApp.showAlert("Ошибка синхронизации с облаком. Проверьте интернет-соединение.");
                        var saveBtn = document.getElementById('header-save');
                        saveBtn.disabled = false; saveBtn.textContent = "💾 СЕЙВ В ОБЛАКО";
                    }
                });
            }

            makeRequest();
        }

        function compressData(data) {
            try {
                var encoder = new TextEncoder();
                var encoded = encoder.encode(data);
                var compressed = pako.gzip(encoded);
                return btoa(String.fromCharCode.apply(null, new Uint8Array(compressed)))
                           .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); // Безопасный Base64 для таблиц
            } catch (error) {
                console.error('Ошибка сжатия:', error);
                return data;
            }
        }

        function decompressData(compressed) {
            try {
                if (!compressed) return compressed;
                // Восстанавливаем символы безопасного Base64 перед распаковкой
                var restored = compressed.replace(/-/g, '+').replace(/_/g, '/');
                while (restored.length % 4) restored += '=';
                
                var data = atob(restored);
                var byteData = new Uint8Array(data.length);
                for (var i = 0; i < data.length; i++) {
                    byteData[i] = data.charCodeAt(i);
                }
                return pako.ungzip(byteData, { to: 'string' });
            } catch (error) {
                console.error('Ошибка распаковки:', error);
                return compressed;
            }
        }

                            saveBtn.disabled = false; saveBtn.textContent = "💾 СЕЙВ В ОБЛАКО";

        function bindKey(elementId, nesKey) {
            var el = document.getElementById(elementId);
            if(el) {
                el.addEventListener('touchstart', function(e) { 
                    e.preventDefault(); 
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                    }
                    if(currentSystem === "nes") nes.buttonDown(1, nesKey); 
                }, { passive: false });
                
                el.addEventListener('touchend', function(e) { 
                    e.preventDefault(); 
                    if(currentSystem === "nes") nes.buttonUp(1, nesKey); 
                }, { passive: false });
                
                el.addEventListener('mousedown', function(e) { 
                    if(currentSystem === "nes") nes.buttonDown(1, nesKey); 
                });
                el.addEventListener('mouseup', function(e) { 
                    if(currentSystem === "nes") nes.buttonUp(1, nesKey); 
                });
            }
        }
        bindKey('up', jsnes.Controller.BUTTON_UP); bindKey('down', jsnes.Controller.BUTTON_DOWN);
        bindKey('left', jsnes.Controller.BUTTON_LEFT); bindKey('right', jsnes.Controller.BUTTON_RIGHT);
        bindKey('btn-a', jsnes.Controller.BUTTON_A); bindKey('btn-b', jsnes.Controller.BUTTON_B);
