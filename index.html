<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9999 IN 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="games.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #emulator { width: 100%; height: 100%; flex-grow: 1; }
    </style>
</head>
<body>
    <div id="app">
        <div id="emulator"></div>
    </div>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Берем первую игру из списка для теста (или любую другую)
        var game = window.MY_GAMES[0]; 

        EJS_player = "#emulator";
        EJS_core = game.system === "nes" ? "nes" : (game.system === "sega" ? "segaMD" : "snes");
        EJS_gameName = game.title;
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        EJS_gameUrl = window.location.origin + "/" + game.file;
        EJS_startOnLoaded = true;
        
        // Включаем поддержку сохранений через IndexedDB (автоматически)
        EJS_coreConfig = {
            cacheFileSystem: "indexeddb",
            autosave: true
        };
    </script>
</body>
</html>
