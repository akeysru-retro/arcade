<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9999 IN 1 - Ultimate Retro Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.1/jsnes.min.js"></script>
    <script src="games.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            background-color: #000; color: #fff; margin: 0; padding: 0;
            font-family: 'Press Start 2P', monospace;
            height: 100vh; overflow: hidden; user-select: none;
        }
        body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .header-panel {
            display: flex; width: 100%; max-width: 400px; justify-content: space-between; align-items: center;
            padding: 8px 15px; box-sizing: border-box; background: #000; border-bottom: 2px solid #333; 
            position: relative; z-index: 10000;
        }
        .head-btn {
            background: #222; border: 2px solid #555; color: #fff;
            font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 6px 10px; cursor: pointer;
        }
        #sound-toggle.muted { color: #ffaa00; border-color: #663333; }
        #back-to-catalog { display: none; background: #224; border-color: #448; }
        
        .nes-io-btn { display: none; font-size: 7px; padding: 6px 8px; }
        #header-save { background: #1e3d1e; border-color: #387338; color: #8fdf8f; }
        #header-load { background: #1e2e3d; border-color: #385973; color: #8fbadf; }

        #catalog-container {
            width: 100%; max-width: 400px; flex-grow: 1; overflow-y: auto; position: relative;
            background-color: #000; padding-top: 25px; padding-bottom: 70px; box-sizing: border-box;
            z-index: 10; display: flex; flex-direction: column; align-items: center;
        }
        .bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none; }
        .app-section { width: 100%; z-index: 5; position: relative; display: none; }
        #section-games { display: block; }
        .menu-title { font-size: 20px; color: #ffff00; text-shadow: 3px 3px #000; margin-bottom: 25px; text-align: center; letter-spacing: 2px; }
        .game-list { width: 100%; padding: 0 25px; box-sizing: border-box; }
        
        .retro-item { font-size: 10px; color: #fff; text-shadow: 2px 2px #000; padding: 12px 0; display: flex; align-items: center; text-transform: uppercase; border-bottom: 1px solid #111; justify-content: space-between; }
        .game-click-zone { display: flex; align-items: center; flex-grow: 1; cursor: pointer; justify-content: space-between; overflow: hidden; }
        .game-click-zone:active { color: #ffff00; }
        .game-title-text { display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-title-text::before { content: "▶ "; opacity: 0; margin-right: 8px; color: #ffff00; }
        .game-click-zone:active .game-title-text::before { opacity: 1; }
        
        .item-system-badge { font-size: 7px; padding: 3px 6px; background: #333; border-radius: 2px; color: #fff; margin-left: 10px; font-family: sans-serif; font-weight: bold; flex-shrink: 0; }
        .badge-nes { background: #b91c1c; }
        .badge-sega { background: #1e3a8a; }
        .badge-snes { background: #4c1d95; } 

        .fav-star-btn { font-size: 14px; cursor: pointer; padding: 0 5px 0 15px; user-select: none; filter: grayscale(100%); }
        .fav-star-btn.active { filter: grayscale(0%); text-shadow: 0 0 4px #ffcc00; }
        .fav-filter-toggle { background: #111; border: 2px dashed #444; color: #888; font-family: 'Press Start 2P', monospace; font-size: 7px; padding: 6px; width: calc(100% - 40px); margin: 0 20px 15px 20px; box-sizing: border-box; text-align: center; }
        .fav-filter-toggle.active { border-color: #ffcc00; color: #ffcc00; background: #221c00; }

        .pagination-container { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 20px 25px 10px 25px; box-sizing: border-box; z-index: 15; position: relative; gap: 10px; }
        .page-btn { background: #222; border: 2px solid #555; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 8px; padding: 8px 12px; cursor: pointer; }
        .page-info-text { font-size: 7px; color: #888; text-align: center; }

        .secret-card { background: rgba(17, 17, 17, 0.9); border: 2px solid #444; margin: 0 20px 15px 20px; padding: 15px; }
        .secret-game { font-size: 10px; color: #ffff00; margin-bottom: 6px; }
        .secret-title { font-size: 8px; color: #00ff00; margin-bottom: 10px; }
        .secret-code { font-size: 8px; color: #fff; background: #000; padding: 8px; border: 1px dashed #555; word-wrap: break-word; }

        .order-container { padding: 0 25px; box-sizing: border-box; width: 100%; }
        .order-text { font-size: 8px; line-height: 1.6; color: #aaa; margin-bottom: 20px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-label { font-size: 8px; color: #ffff00; }
        .form-input { background: #111; border: 2px solid #555; padding: 10px; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 9px; }
        .order-submit-btn { width: 100%; background: #0064ff; border: 3px solid #0040aa; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 12px; cursor: pointer; }

        .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 55px; background: #111; border-top: 3px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; box-sizing: border-box; }
        .tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; height: 100%; color: #888; background: none; border: none; font-family: 'Press Start 2P', monospace; font-size: 7px; gap: 6px; }
        .tab-item.active { color: #ffff00; background: #1a1a1a; }
        .tab-icon { font-size: 14px; }

        #game-screen { display: none; width: 100%; max-width: 400px; flex-grow: 1; background: #000; position: relative; z-index: 20; height: 100vh; }
        #game-container { width: 100%; flex-grow: 1; max-height: calc(100vh - 250px); background: #000; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; padding-top: 15px; box-sizing: border-box; }
        #nes-canvas { width: 100%; max-height: 100%; object-fit: contain; display: block; image-rendering: pixelated; }

        /* Разворачиваем Сегу/SNES во весь экран, чтобы перекрыть все баги */
        #sega-display-container { display: none; width: 100%; max-width: 400px; height: calc(100vh - 44px); position: absolute; top: 44px; left: 0; z-index: 99999; background: #000; }
        #sega-display-container iframe { width: 100%; height: 100%; border: none; display: block; }

        #gamepad { position: absolute; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; width: 100%; padding: 15px; box-sizing: border-box; justify-content: space-between; border-top: 4px solid #222; background: #111; }
        .main-controls { display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 130px; height: 130px; }
        .btn { background: #222; border: 3px solid #444; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .btn:active { background: #444; }
        #nes-buttons { display: inline-flex; gap: 15px; }
        .round-btn { width: 60px; height: 60px; background: #cc1111; border-radius: 50%; border: 4px solid #fff; color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
        .system-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 15px; }
        .sys-row { display: flex; justify-content: center; gap: 20px; }
        .sys-btn { background: #333; border: 2px solid #555; color: #aaa; width: 80px; height: 22px; border-radius: 4px; font-size: 8px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="header-panel">
        <button id="back-to-catalog" class="head-btn">↩ МЕНЮ</button>
        <button id="header-save" class="head-btn nes-io-btn">💾 SAVE</button>
        <div id="main-title" style="font-size: 8px; letter-spacing: 1px;">9999 IN 1</div>
        <button id="header-load" class="head-btn nes-io-btn">📂 LOAD</button>
        <button id="sound-toggle" class="head-btn muted">🔇 ЗВУК</button>
    </div>
    
    <div id="catalog-container">
        <video id="menu-bg-video" class="bg-video" loop playsinline webkit-playsinline>
            <source src="background-video.mp4" type="video/mp4">
        </video>

        <div id="section-games" class="app-section">
            <div class="menu-title">9999 IN 1</div>
            <div style="padding: 0 20px 10px 20px; width: 100%; box-sizing: border-box;">
                <input type="text" id="search-games-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ..." oninput="filterGames()">
            </div>
            <button id="fav-filter-btn" class="fav-filter-toggle" onclick="toggleFavFilter()">[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]</button>
            <div class="game-list" id="retro-game-list"></div>
            <div class="pagination-container" id="pagination-controls"></div>
        </div>

        <div id="section-secrets" class="app-section">
            <div class="menu-title">СЕКРЕТЫ</div>
            <div style="padding: 0 20px 15px 20px;">
                <input type="text" id="search-secrets-input" class="form-input" style="width: 100%; box-sizing: border-box;" placeholder="ПОИСК ИГРЫ ИЛИ ЧИТА..." oninput="filterSecrets()">
            </div>
            <div id="secrets-container"></div>
        </div>

        <div id="section-order" class="app-section">
            <div class="menu-title">ЗАКАЗ ИГР</div>
            <div class="order-container">
                <div class="order-text">ЗАКАЗ НОВОЙ ИГРЫ ПЛАТНЫЙ (100 РУБЛЕЙ). НАПИШИТЕ НАЗВАНИЕ, И МЫ ДОБАВИМ ЕЁ НА ПОЛКУ БОТА!</div>
                <div class="form-group">
                    <label class="form-label">НАЗВАНИЕ ИГРЫ:</label>
                    <input type="text" id="order-game-title" class="form-input" placeholder="TEENAGE MUTANT TURTLES">
                </div>
                <div class="form-group">
                    <label class="form-label">ПЛАТФОРМА (КОНСОЛЬ):</label>
                    <input type="text" id="order-game-system" class="form-input" placeholder="DENDY / SEGA / GBA">
                </div>
                <button id="order-btn-submit" class="order-submit-btn" onclick="sendOrderRequest()">ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>

        <div class="tab-bar" id="app-tab-bar">
            <button class="tab-item active" onclick="switchTab('games', this)">🎮<br>ИГРЫ</button>
            <button class="tab-item" onclick="switchTab('secrets', this)">🔑<br>СЕКРЕТЫ</button>
            <button class="tab-item" onclick="switchTab('order', this)">📥<br>ЗАКАЗ</button>
        </div>
    </div>

    <div id="game-screen">
        <div id="game-container">
            <canvas id="nes-canvas" width="256" height="240"></canvas>
        </div>
        <div id="sega-display-container"></div>
        
        <div id="gamepad">
            <div class="main-controls">
                <div class="dpad">
                    <div></div><div class="btn" id="up">▲</div><div></div>
                    <div class="btn" id="left">◀</div><div></div><div class="btn" id="right">▶</div>
                    <div></div><div class="btn" id="down">▼</div><div></div>
                </div>
                <div id="nes-buttons">
                    <div class="round-btn" id="btn-b">B</div>
                    <div class="round-btn" id="btn-a">A</div>
                </div>
            </div>
            <div class="system-buttons">
                <div class="sys-row">
                    <div class="sys-btn" id="btn-select">SELECT</div><div class="sys-btn" id="btn-start">START</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        var gasRetroUrl = "https://script.google.com/macros/s/AKfycbwBjulaVnjKN-Af3oDFFFaG4Us8n6Jgcz3BTJRL1HThFxlgMuxv_D4x1yK4Khy-BsVL/exec";
        var baseGames = []; var filteredGames = []; var currentPage = 1; var itemsPerPage = 5; var showOnlyFavorites = false;
        var currentRomName = ""; var currentSystem = "nes"; var gameLoopInterval = null; var allSecrets = [];

        var rawGamesList = window.MY_GAMES || [];
        if (rawGamesList.length > 0) {
            baseGames = rawGamesList.sort((a,b) => a.title.toString().toLowerCase().trim().localeCompare(b.title.toString().toLowerCase().trim(), 'ru'));
            filteredGames = [].concat(baseGames); renderGamesPage(currentPage);
        }

        function isGameFavorite(file) { return JSON.parse(localStorage.getItem('retro_favs') || "[]").includes(file); }
        function toggleFavorite(file, event) {
            event.stopPropagation(); var favs = JSON.parse(localStorage.getItem('retro_favs') || "[]");
            var idx = favs.indexOf(file); if (idx === -1) favs.push(file); else favs.splice(idx, 1);
            localStorage.setItem('retro_favs', JSON.stringify(favs));
            if (showOnlyFavorites) filterGames(); else renderGamesPage(currentPage);
        }

        function filterGames() {
            var query = document.getElementById('search-games-input').value.toLowerCase().trim();
            filteredGames = baseGames.filter(g => g.title.toLowerCase().includes(query) && (!showOnlyFavorites || isGameFavorite(g.file)));
            currentPage = 1; renderGamesPage(currentPage);
        }

        function toggleFavFilter() {
            showOnlyFavorites = !showOnlyFavorites;
            var btn = document.getElementById('fav-filter-btn');
            btn.textContent = showOnlyFavorites ? "[ ⭐ РЕЖИМ: ТОЛЬКО ИЗБРАННОЕ ]" : "[ ПОКАЗАТЬ ⭐ ИЗБРАННОЕ ]";
            filterGames();
        }

        function renderGamesPage(page) {
            var listContainer = document.getElementById('retro-game-list'); if (!listContainer) return;
            listContainer.innerHTML = "";
            if (filteredGames.length === 0) { listContainer.innerHTML = '<div style="text-align:center;font-size:8px;color:#555;padding:30px 0;">СПИСОК ПУСТ</div>'; return; }
            
            var startIndex = (page - 1) * itemsPerPage;
            var pageItems = filteredGames.slice(startIndex, startIndex + itemsPerPage);

            pageItems.forEach((game, index) => {
                var num = (startIndex + index + 1).toString().padStart(4, '0');
                var sysLabel = game.system.toUpperCase();
                var badgeClass = game.system === 'sega' ? 'badge-sega' : (game.system === 'snes' ? 'badge-snes' : 'badge-nes');
                var item = document.createElement('div'); item.className = 'retro-item';
                item.innerHTML = `
                    <div class="game-click-zone" onclick="startGame('${game.file}', '${game.title}', '${game.system}')">
                        <div class="game-title-text">${num}. ${game.title}</div>
                        <span class="item-system-badge ${badgeClass}">${sysLabel}</span>
                    </div>
                    <div class="fav-star-btn ${isGameFavorite(game.file)?'active':''}" onclick="toggleFavorite('${game.file}', event)">⭐</div>
                `;
                listContainer.appendChild(item);
            });
            renderPaginationButtons();
        }

        function renderPaginationButtons() {
            var container = document.getElementById('pagination-controls'); if (!container) return; container.innerHTML = "";
            var totalPages = Math.ceil(filteredGames.length / itemsPerPage); if (totalPages <= 1) return;
            var prev = document.createElement('button'); prev.className='page-btn'; prev.disabled=(currentPage===1); prev.textContent="◀ НАЗАД";
            prev.onclick = () => { currentPage--; renderGamesPage(currentPage); };
            var info = document.createElement('span'); info.className='page-info-text'; info.innerHTML=`PAGE<br>${currentPage}/${totalPages}`;
            var next = document.createElement('button'); next.className='page-btn'; next.disabled=(currentPage===totalPages); next.textContent="ВПЕРЕД ▶";
            next.onclick = () => { currentPage++; renderGamesPage(currentPage); };
            container.appendChild(prev); container.appendChild(info); container.appendChild(next);
        }

        var canvas = document.getElementById('nes-canvas'); var ctx = canvas.getContext('2d'); var audioCtx = null; var audioEnabled = false;
        var nes = new jsnes.NES({
            onFrame: function(buffer) {
                var img = ctx.getImageData(0, 0, 256, 240); var d = img.data;
                for (var i = 0; i < buffer.length; i++) { var p = buffer[i]; var idx = i * 4; d[idx] = p & 0xff; d[idx+1] = (p >> 8) & 0xff; d[idx+2] = (p >> 16) & 0xff; d[idx+3] = 255; }
                ctx.putImageData(img, 0, 0);
            }
        });

        // 🔥 УЛЬТИМАТИВНЫЙ ОБХОД БЛОКИРОВОК: ВНУТРЕННИЙ БЭКАП НА БАЗЕ INDEXEDDB ДЛЯ 16-БИТ
        function launchIsolatedEmulatorJS(romUrl, systemType, gameTitle) {
            var container = document.getElementById('sega-display-container');
            container.innerHTML = ""; 
            var coreType = (systemType === "sega") ? "segaMD" : "snes";
            var absoluteRomUrl = window.location.origin + window.location.pathname.replace("index.html", "") + romUrl;
            var localEmulatorPath = window.location.origin + window.location.pathname.replace("index.html", "") + "emulator/";

            var iframeHtml = `
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"></head>
            <body>
                <div id="game" style="width:100vh; height:100vw;"></div>
                <script>
                    EJS_player = "#game";
                    EJS_core = "${coreType}";
                    EJS_gameName = "${gameTitle.replace(/'/g, "")}";
                    EJS_pathtodata = "${localEmulatorPath}";
                    EJS_gameUrl = "${absoluteRomUrl}";
                    EJS_startOnLoaded = true;
                    EJS_mouse = true;
                    EJS_Header = false;
                    
                    // 🔥 ЗАСТАВЛЯЕМ ЯДРО ХРАНИТЬ СЕЙВЫ В БРАУЗЕРНОЙ БАЗЕ ДАННЫХ СМАРТФОНА (БЕЗ ФАЙЛОВ)
                    EJS_coreConfig = {
                        cacheFileSystem: "indexeddb",
                        autosave: true
                    };
                <\/script>
                <script src="${localEmulatorPath}loader.js"><\/script>
            </body>
            </html>
            `;
            var iframe = document.createElement('iframe');
            iframe.id = "active-emulator-iframe"; iframe.srcdoc = iframeHtml; container.appendChild(iframe);
        }

        function startGame(romUrl, gameTitle, system) {
            currentRomName = romUrl; currentSystem = system || "nes";
            document.getElementById('catalog-container').style.display = 'none';
            document.getElementById('app-tab-bar').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('back-to-catalog').style.display = 'block';
            document.getElementById('main-title').textContent = gameTitle;

            if (currentSystem === "sega" || currentSystem === "snes") {
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('gamepad').style.display = 'none';
                document.getElementById('header-save').style.display = 'none'; // Скрываем конфликтные кнопки для 16-бит
                document.getElementById('header-load').style.display = 'none';
                document.getElementById('sega-display-container').style.display = 'block';
                launchIsolatedEmulatorJS(romUrl, currentSystem, gameTitle);
            } else {
                document.getElementById('game-container').style.display = 'flex';
                document.getElementById('gamepad').style.display = 'flex';
                document.getElementById('header-save').style.display = 'block'; // Показываем стабильные кнопки только для Денди
                document.getElementById('header-load').style.display = 'block';
                document.getElementById('sega-display-container').style.display = 'none';
                
                var req = new XMLHttpRequest(); req.open("GET", romUrl, true); req.overrideMimeType("text/plain; charset=x-user-defined");
                req.onload = function() {
                    if (req.status === 200) { nes.loadROM(this.responseText); clearInterval(gameLoopInterval); gameLoopInterval = setInterval(nes.frame, 1000/60); }
                };
                req.send();
            }
        }

        function exitToCatalog() {
            clearInterval(gameLoopInterval);
            if(currentSystem === "sega" || currentSystem === "snes") {
                var iframe = document.getElementById('active-emulator-iframe'); if(iframe) iframe.remove();
                document.getElementById('sega-display-container').style.display = "none";
            }
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('back-to-catalog').style.display = 'none';
            document.getElementById('header-save').style.display = 'none';
            document.getElementById('header-load').style.display = 'none';
            document.getElementById('catalog-container').style.display = 'flex';
            document.getElementById('app-tab-bar').style.display = 'flex';
            document.getElementById('main-title').textContent = '9999 IN 1';
            renderGamesPage(currentPage);
        }

        // 🔥 ЖЕЛЕЗНЫЕ ОБЛАЧНЫЕ СОХРАНЕНИЯ ДЕНДИ ЧЕРЕЗ TELEGRAM CLOUD STORAGE (РАБОТАЕТ ВСЕГДА)
        document.getElementById('header-save').addEventListener('click', function() {
            if (currentSystem === "nes" && currentRomName) {
                try {
                    var rawState = JSON.stringify(nes.toJSON());
                    // Записываем прямо в вечную память профиля Telegram
                    Telegram.WebApp.CloudStorage.setItem("tg_nes_save_" + currentRomName, rawState, function(err, success) {
                        if (success) { alert("ИГРА УСПЕШНО СОХРАНЕНА В ОБЛАКО!"); }
                        else { alert("ОШИБКА СОХРАНЕНИЯ В ОБЛАКО"); }
                    });
                } catch(e) { alert("КРИТИЧЕСКАЯ ОШИБКА ПАМЯТИ"); }
            }
        });

        document.getElementById('header-load').addEventListener('click', function() {
            if (currentSystem === "nes" && currentRomName) {
                // Читаем из вечной памяти Telegram
                Telegram.WebApp.CloudStorage.getItem("tg_nes_save_" + currentRomName, function(err, value) {
                    if (value) { nes.fromJSON(JSON.parse(value)); alert("ЗАГРУЗКА ИЗ ОБЛАКА УСПЕШНА!"); }
                    else { alert("НЕТ ОБЛАЧНЫХ СОХРАНЕНИЙ"); }
                });
            }
        });

        function bindKey(id, k) {
            var el = document.getElementById(id); if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); nes.buttonDown(1, k); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); nes.buttonUp(1, k); });
        }
        bindKey('up', jsnes.Controller.BUTTON_UP); bindKey('down', jsnes.Controller.BUTTON_DOWN);
        bindKey('left', jsnes.Controller.BUTTON_LEFT); bindKey('right', jsnes.Controller.BUTTON_RIGHT);
        bindKey('btn-a', jsnes.Controller.BUTTON_A); bindKey('btn-b', jsnes.Controller.BUTTON_B);
        bindKey('btn-start', jsnes.Controller.BUTTON_START); bindKey('btn-select', jsnes.Controller.BUTTON_SELECT);

        function switchTab(tabId, btn) {
            document.querySelectorAll('.app-section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('section-' + tabId).style.display = 'block'; btn.classList.add('active');
        }
    </script>
</body>
</html>
